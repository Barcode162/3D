# The project hub (hub/, joshuavelasco.com/hub) deploys on its own: about two
# minutes, without rebuilding or retesting the game (docs/DECISIONS.md →
# Deploys by system). deploy.yml skips the game when only the hub changed.
name: Hub

on:
  push:
    branches: [main]
    paths: ['hub/**', 'news/**', 'ui/**', 'toolbelt/**', 'dev/**', 'tools/dev_test.mjs', 'tools/lib/webspace.mjs', 'PLAN.md', 'docs/charter/**', 'docs/plan/**', 'tools/plan.mjs', 'tools/plan_test.mjs', 'tools/lib/plandata.mjs', 'tools/toolbelt_test.mjs', 'tools/uikit.mjs', 'tools/ui_editor_test.mjs', 'tools/ui_api_test.mjs', 'homepage/**', 'tools/site_test.mjs', 'studio/**', 'tools/studio_api_test.mjs', 'tools/ui_test.mjs', 'tools/hub_test.mjs', 'server/account.php', '.github/workflows/hub.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a running one: each upload copies the whole folders,
# so the newest run carries everything, and a stuck run can't hold the queue.
concurrency:
  group: hub
  cancel-in-progress: true

env:
  IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
  IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
  IONOS_HOME: home

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dev's Overview shows each deploy's real state (restructure J2.3).
      - name: "Report: started (for Dev)"
        if: env.IONOS_SFTP_HOST != ''
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: node tools/ci_status.mjs site start

      # Every test runs even when an earlier one failed (one failure never
      # hides another); the upload only happens when they all passed. Every
      # check is listed once in tools/lib/checks.mjs (tools/workflows_test.mjs).
      - name: "Test: PHP syntax"
        id: php
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: for f in hub/*.php news/*.php $(find homepage -name "*.php") studio/*.php toolbelt/ui-editor/*.php dev/*.php server/account.php; do php -l "$f"; done

      - name: Install Playwright
        id: playwright
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: "Test: the project hub (hub/ + account.php on PHP's server)"
        id: hub
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: mkdir -p build && node tools/hub_test.mjs

      - name: "Test: the site (homepage/: every page, the staff-only portal)"
        id: site
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/site_test.mjs

      - name: "Test: the Toolbelt's list (toolbelt/tools.json)"
        id: toolbelt
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/toolbelt_test.mjs

      - name: "Test: Dev (dev/, the control room)"
        id: dev
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/dev_test.mjs

      - name: "Test: the UI Editor (toolbelt/ui-editor/) and its store (api.php)"
        id: ui_editor
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/ui_api_test.mjs && node tools/ui_editor_test.mjs

      - name: "Test: the theme files and themes.css agree (tools/uikit.mjs)"
        id: uikit
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/uikit.mjs check

      - name: "Test: the shared look (ui/, every theme)"
        id: ui
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/ui_test.mjs

      - name: "Test: the world store (studio/api.php) and the Studio's edits (studio/ops.mjs)"
        id: studio_api
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/studio_api_test.mjs && node tools/ops_test.mjs

      - name: "Test: the plan keeps its shape and the Charter matches it (tools/plan_test.mjs)"
        id: plan
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node tools/plan_test.mjs

      - name: Upload the hub to IONOS
        id: upload
        if: env.IONOS_SFTP_HOST != ''
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          lftp --env-password -u "$IONOS_SFTP_USER" "sftp://$IONOS_SFTP_HOST" <<EOF2
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mkdir -p -f $IONOS_HOME/hub
          mkdir -p -f private/hub
          mirror -R --verbose --no-perms $GITHUB_WORKSPACE/hub $IONOS_HOME/hub
          rm -f $IONOS_HOME/hub/board.html $IONOS_HOME/hub/list.html
          mirror -R --verbose --no-perms $GITHUB_WORKSPACE/homepage $IONOS_HOME
          mkdir -p -f $IONOS_HOME/studio
          mkdir -p -f private/studio
          mirror -R --verbose --no-perms $GITHUB_WORKSPACE/studio $IONOS_HOME/studio
          mkdir -p -f $IONOS_HOME/dev
          mkdir -p -f private/dev
          mirror -R --verbose --no-perms $GITHUB_WORKSPACE/dev $IONOS_HOME/dev
          put $GITHUB_WORKSPACE/docs/plan/plan.json -o private/dev/plan.json
          put $GITHUB_WORKSPACE/docs/charter/rules.json -o private/dev/rules.json
          mkdir -p -f $IONOS_HOME/toolbelt
          mkdir -p -f private/ui
          mirror -R --verbose --no-perms $GITHUB_WORKSPACE/toolbelt $IONOS_HOME/toolbelt
          mkdir -p -f $IONOS_HOME/ui
          mirror -R --verbose --no-perms $GITHUB_WORKSPACE/ui $IONOS_HOME/ui
          mkdir -p -f $IONOS_HOME/news
          mirror -R --verbose --no-perms $GITHUB_WORKSPACE/news $IONOS_HOME/news
          bye
          EOF2

      # How this deploy ended, even when a test failed or a newer run took over (J2.3).
      - name: "Report: finished (for Dev)"
        if: always() && env.IONOS_SFTP_HOST != ''
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node tools/ci_status.mjs site end
