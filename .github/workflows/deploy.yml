# Builds the C++ app to WebAssembly and publishes the result to the
# `gh-pages` branch when a push to main changes the game. GitHub Pages serves
# that branch (repo Settings -> Pages -> Deploy from a branch -> gh-pages / root).
# Deploys by system (docs/archive/DECISIONS.md): the `changes` job compares main with
# the build that is live (gh-pages' "Site build <sha>"), so a batch of pushes is
# one deploy and nothing is missed. Only the hub, docs or notes changed → the
# game is left alone (the hub has its own workflow, hub.yml).
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write        # to cancel a stuck Pages deployment (see below)
  deployments: read

env:
  EMSDK_VERSION: 6.0.12
  # IONOS web hosting login (repo Settings -> Secrets and variables ->
  # Actions). When set, the game and the multiplayer relay are also
  # uploaded to the IONOS site. joshuavelasco.com points at the webspace
  # folder IONOS_HOME; every project deploys into its own subfolder of it
  # (this one: IONOS_DIR). The site around them (homepage/) is hub.yml's
  # (docs/handbook/deploy-map.json: one workflow per folder).
  IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
  IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
  IONOS_HOME: home
  IONOS_DIR: home/bar
  # Only a flag here: the Cloudflare token itself goes only into the env of
  # the steps that run wrangler (a job-level `if:` can't read secrets).
  HAVE_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
  # The browser tests open the bar with ?light=test here (tools/lib/browser.mjs):
  # the tests' own lighting (a flat light, no lamps, reflections, glow or full
  # mirrors), quick on GitHub's machines that draw in software (KI-5). The
  # phone and the piece pictures cover the real light.
  TEST_LIGHT: test
  # ... and draws at most 4 frames a second there (?fps=4, J54.2): a software
  # GPU that never catches up made every picture wait behind a pile of frames
  # and a second page never finish loading (KI-5's cause, J54.1). The game's
  # logic still runs every frame.
  TEST_FPS: 4

jobs:
  # Did anything in the game change since the live build? Files that never
  # reach the game: the hub, docs, Markdown notes, the hub's tools, settings.
  changes:
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.diff.outputs.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          live=$(git log -1 --format=%s origin/gh-pages 2>/dev/null | sed -n 's/^Site build \([0-9a-f]\{7,\}\)$/\1/p')
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$live" ] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then
            echo "Live build unknown (or run by hand): full deploy"; echo "game=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Live build: $live. Changed since then:"
          git diff --name-only "$live" HEAD | tee /tmp/changed
          game=$(grep -v -E '^(hub/|news/|homepage/|studio/|toolbelt/|dev/|tools/dev_test\.mjs$|tools/lib/webspace\.mjs$|tools/toolbelt_test\.mjs$|tools/plan(_test)?\.mjs$|tools/studio_api_test\.mjs$|tools/ui_test\.mjs$|tools/site_test\.mjs$|docs/|\.claude/|[^/]+\.md$|tools/hub(_test)?\.mjs$|\.github/workflows/(hub|classic|plan)\.yml$)' /tmp/changed | head -1)
          if [ -n "$game" ]; then echo "game=true" >> "$GITHUB_OUTPUT"; echo "→ the game changed ($game ...): build, test, deploy";
          else echo "game=false" >> "$GITHUB_OUTPUT"; echo "→ nothing in the game changed: left alone"; fi

  # The build goes live here (about 6 minutes); its tests run in the next job
  # (J66, KI-32). Deploys queue instead of cancel: a push during a deploy
  # waits, then deploys everything since the live build (a restart wasted the
  # first 10 minutes), but it waits only for that deploy, never its tests.
  build-and-publish:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      live: ${{ steps.upload.outcome == 'success' }}
      ws: ${{ steps.cfroom.outputs.ws }}
    steps:
      - uses: actions/checkout@v4

      # Dev's Overview shows each deploy's real state (restructure J2.3): started,
      # live, then every test's result by name (tools/ci_status.mjs).
      - name: "Report: started (for Dev)"
        timeout-minutes: 5
        if: env.IONOS_SFTP_HOST != ''
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: node tools/ci_status.mjs game start

      - name: Cache Emscripten
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-v1

      - name: Install Emscripten
        timeout-minutes: 15
        run: |
          if [ ! -d emsdk ]; then git clone --depth 1 https://github.com/emscripten-core/emsdk.git; fi
          ./emsdk/emsdk install $EMSDK_VERSION
          ./emsdk/emsdk activate $EMSDK_VERSION

      # Compressed textures (tools/assets/astc_pack.py, run by the build):
      # ARM's astcenc, and the textures already encoded (only new or changed
      # images are encoded again).
      - name: Cache compressed textures
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: build/astc_cache
          key: astc-${{ hashFiles('tools/assets/astc_pack.py') }}-${{ hashFiles('assets/models/*.glb') }}
          restore-keys: astc-${{ hashFiles('tools/assets/astc_pack.py') }}-

      - name: Install astcenc
        timeout-minutes: 10
        run: |
          curl -sSL -o /tmp/astcenc.zip https://github.com/ARM-software/astc-encoder/releases/download/5.2.0/astcenc-5.2.0-linux-x64.zip
          mkdir -p .astcenc && unzip -o -q /tmp/astcenc.zip -d .astcenc
          sudo apt-get install -y python3-numpy python3-pil >/dev/null  # astc_pack.py reads and mipmaps images

      - name: Build
        timeout-minutes: 30
        id: build
        run: |
          source ./emsdk/emsdk_env.sh
          sudo apt-get install -y ninja-build >/dev/null
          emcmake cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" build/site/index.html
          echo "${GITHUB_SHA::7}" > build/site/version.txt
          touch build/site/.nojekyll
          # The room's physics (the bar's C++ for the Cloudflare Worker).
          bash cloud/sim/build.sh

      # --- Quick tests before anything goes live (seconds), and the room's
      # (the shared server goes live with this build): a failure here stops the
      # deploy. The game's own tests run after the upload (user, 2026-10-21:
      # the new build is on the phone in ~6 minutes, not ~30). Every check is
      # listed once in tools/lib/checks.mjs; tools/workflows_test.mjs keeps
      # this file in step with it.
      - name: "Test: PHP syntax, EM_ASM lint, the world's schema, materials"
        id: lint
        timeout-minutes: 10
        run: |
          for f in server/*.php; do php -l "$f"; done
          node tools/lint_emasm.mjs
          node tools/schema_test.mjs
          node tools/albedo_test.mjs
          # Looped stays a real engine: it never reaches into the bar (docs/archive/LOOPED.md B).
          if grep -rn '#include "bar/' looped; then echo "looped/ must not include bar/"; exit 1; fi

      - name: "Test: room protocol codec (cloud/proto.js on the golden vectors)"
        id: proto
        timeout-minutes: 10
        run: node tools/proto_test.mjs

      - name: "Test: room server (wrangler dev + tools/room_test.mjs)"
        id: room
        timeout-minutes: 10
        run: |
          npm ci --prefix cloud --no-audit --no-fund >/dev/null
          node tools/room_test.mjs

      - name: "Test: the ledger (money and owned things, wrangler dev)"
        id: ledger
        timeout-minutes: 10
        run: node tools/ledger_test.mjs


      # Prints only whether the Cloudflare secrets exist, whether wrangler
      # accepts the token, and whether a workers.dev subdomain is registered.
      - name: "Check: Cloudflare"
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets: missing"; exit 0
          fi
          echo "Cloudflare secrets: set"
          npm ci --prefix cloud --no-audit --no-fund >/dev/null
          # (whoami's own output has the account email; the logs are public)
          if npx --prefix cloud wrangler whoami 2>&1 | grep -q "You are logged in"; then echo "wrangler: token works"; else echo "wrangler: token rejected"; fi
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          echo "$sub" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("workers.dev subdomain:", (r.get("subdomain") + ".workers.dev") if r.get("subdomain") else "none (" + str([e.get("message") for e in d.get("errors", [])]) + ")")'

      # The realtime room (cloud/) goes live before the game that needs it.
      # Its address is written into config.json, which the game reads at
      # start-up to find the room (docs/archive/RESTRUCTURE.md 2.12, step 3.3).
      - name: "Deploy: Cloudflare room"
        id: cfroom
        if: env.HAVE_CF == 'true'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --prefix cloud --no-audit --no-fund >/dev/null
          out=$(cd cloud && npx wrangler deploy 2>&1) || { echo "$out" | grep -v -i "email"; echo "wrangler deploy failed"; exit 1; }
          echo "$out" | grep -v -i "email" | tail -15
          url=$(echo "$out" | grep -o 'https://bar3d\.[a-z0-9-]*\.workers\.dev' | head -1)
          if [ -z "$url" ]; then echo "No workers.dev address in wrangler's output"; exit 1; fi
          echo "Room server: $url"
          for i in 1 2 3 4 5 6; do
            if curl -sf "$url/health" | grep -q '"ok":1'; then echo "Health check: ok"; break; fi
            [ $i = 6 ] && { echo "Health check failed"; exit 1; }
            sleep 5
          done
          echo "CF_WS=${url/https:/wss:}" >> "$GITHUB_ENV"
          echo "ws=${url/https:/wss:}" >> "$GITHUB_OUTPUT"  # the tests job writes the same config.json

      # What the game reads at start-up: this build, the room's address, the
      # accounts and reports servers. Written even without Cloudflare (ws "").
      - name: Write config.json
        timeout-minutes: 5
        run: |
          python3 - <<PY
          import json, os
          json.dump({"build": os.environ["GITHUB_SHA"][:7], "proto": 1, "ws": os.environ.get("CF_WS", ""), "room": "main",
                     "accountsUrl": "https://joshuavelasco.com/bar/account.php",
                     "reportUrl": "https://joshuavelasco.com/bar/report.php"},
                    open("build/site/config.json", "w"))
          PY
          cat build/site/config.json

      # A Pages deployment that hangs on GitHub's side blocks every later
      # one ("in progress deployment, please cancel <sha> first"). Cancel
      # any unfinished ones so this build can go live.
      - name: Cancel stuck Pages deployments
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo=${{ github.repository }}
          live=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          for sha in $(gh api "repos/$repo/deployments?environment=github-pages&per_page=5" --jq '.[].sha'); do
            [ "$sha" = "$live" ] && continue  # the site that's up now
            echo "Cancelling Pages deployment $sha (no-op if it already finished)"
            gh api -X POST "repos/$repo/pages/deployments/$sha/cancel" || true
          done

      # The multiplayer relay (server/relay.php) runs on the IONOS web
      # hosting, next to a second copy of the game. mirror sends files whose
      # size or time differ (no --ignore-time: it skipped same-size edits),
      # then every page script and per-build file is sent again by name,
      # with the list taken from build/site so new scripts aren't missed.
      - name: Upload to IONOS
        id: upload
        if: env.IONOS_SFTP_HOST != ''
        timeout-minutes: 20
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          cp server/relay.php server/account.php server/report.php server/gate.php server/gate.html server/.htaccess build/site/
          cd build/site
          lftp --env-password -u "$IONOS_SFTP_USER" "sftp://$IONOS_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mkdir -p -f $IONOS_DIR
          mkdir -p -f private/bar/reports
          mirror -R --verbose --no-perms --parallel=4 -x '^\.git/' . $IONOS_DIR
          cd $IONOS_DIR
          mput index.html version.txt app.wasm $(ls *.js *.json | tr '\n' ' ') relay.php account.php report.php gate.php gate.html .htaccess
          cls -l
          bye
          EOF

      - name: "Report: live (for Dev)"
        if: steps.upload.outcome == 'success' && env.IONOS_SFTP_HOST != ''
        timeout-minutes: 5
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: node tools/ci_status.mjs game live

      # The game is private now (docs/archive/LOOPED.md A1): gh-pages keeps only a
      # signpost to joshuavelasco.com/bar, and its commit message records the
      # live build for the `changes` job above. After the IONOS upload, so a
      # failed upload isn't recorded as live.
      - name: Publish to gh-pages
        timeout-minutes: 5
        run: |
          mkdir -p build/pages && cd build/pages
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Bar3D has moved</title><meta http-equiv="refresh" content="0; url=https://joshuavelasco.com/bar/">
          <style>body{font:18px system-ui,sans-serif;background:#0b0716;color:#f6f0ff;display:grid;place-items:center;min-height:90vh;text-align:center}a{color:#5ad1ff}</style>
          <p>Bar3D lives at <a href="https://joshuavelasco.com/bar/">joshuavelasco.com/bar</a> now.<br>
          The public version: <a href="https://joshuavelasco.com/classic/">Bar3D classic</a>.</p>
          HTML
          cp index.html 404.html
          echo "${GITHUB_SHA::7}" > version.txt
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      # Dev's Overview: a deploy that stopped before its tests (a quick check
      # or the room's tests failed, the upload broke) reports how it ended
      # here; one that went live reports from the tests job (J2.3, J66).
      - name: "Report: stopped before the tests (for Dev)"
        if: failure() && env.IONOS_SFTP_HOST != ''
        timeout-minutes: 5
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node tools/ci_status.mjs game end

  # The game's tests, after it's live (J66): its own machine and its own
  # queue, so the next deploy never waits for them. The same commit is built
  # again here (the caches make it a few minutes) and given the same
  # config.json as the live one.
  tests:
    needs: build-and-publish
    if: needs.build-and-publish.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: game-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-v1

      - name: Install Emscripten
        timeout-minutes: 15
        run: |
          if [ ! -d emsdk ]; then git clone --depth 1 https://github.com/emscripten-core/emsdk.git; fi
          ./emsdk/emsdk install $EMSDK_VERSION
          ./emsdk/emsdk activate $EMSDK_VERSION

      - name: Cache compressed textures
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: build/astc_cache
          key: astc-${{ hashFiles('tools/assets/astc_pack.py') }}-${{ hashFiles('assets/models/*.glb') }}
          restore-keys: astc-${{ hashFiles('tools/assets/astc_pack.py') }}-

      - name: Install astcenc
        timeout-minutes: 10
        run: |
          curl -sSL -o /tmp/astcenc.zip https://github.com/ARM-software/astc-encoder/releases/download/5.2.0/astcenc-5.2.0-linux-x64.zip
          mkdir -p .astcenc && unzip -o -q /tmp/astcenc.zip -d .astcenc
          sudo apt-get install -y python3-numpy python3-pil >/dev/null

      - name: Build
        id: build
        timeout-minutes: 30
        run: |
          source ./emsdk/emsdk_env.sh
          sudo apt-get install -y ninja-build >/dev/null
          emcmake cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" build/site/index.html
          echo "${GITHUB_SHA::7}" > build/site/version.txt
          touch build/site/.nojekyll
          bash cloud/sim/build.sh
          npm ci --prefix cloud --no-audit --no-fund >/dev/null  # wrangler dev, for the tests that need a room

      - name: Write config.json
        timeout-minutes: 5
        env:
          CF_WS: ${{ needs.build-and-publish.outputs.ws }}
        run: |
          python3 - <<PY
          import json, os
          json.dump({"build": os.environ["GITHUB_SHA"][:7], "proto": 1, "ws": os.environ.get("CF_WS", ""), "room": "main",
                     "accountsUrl": "https://joshuavelasco.com/bar/account.php",
                     "reportUrl": "https://joshuavelasco.com/bar/report.php"},
                    open("build/site/config.json", "w"))
          PY

      # --- The game's tests, after it's live (about an hour). Every test runs
      # even when an earlier one failed, so one failure never hides another,
      # and each has its own time limit. A failure turns the run red, except a
      # test "allowed to fail", which names its open known issue
      # (docs/records/known-issues.md) and still shows in Dev's report.
      - name: "Test: native (g++ and em++ + node)"
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          source ./emsdk/emsdk_env.sh
          bash tools/native/run.sh

      - name: Install Playwright
        id: playwright
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: "Test: the shaders compile (WGSL, in Chromium's WebGPU)"
        id: wgsl
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/wgsl_check.mjs

      - name: "Test: browser smoke (Release build)"
        id: smoke
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 20
        run: FAIL_MODEL=candle node tools/smoke.mjs  # + a blocked download must still let you in

      - name: "Test: the live world from the Studio's store (a fake store)"
        id: live_world
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/live_world_test.mjs

      - name: "Test: the Studio (studio/ around the bar in studio mode) (allowed to fail: KI-24)"
        id: studio
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 45
        continue-on-error: true
        run: node tools/studio_test.mjs

      - name: "Test: the private bar's door (gate.php, invites, admins)"
        id: gate
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/gate_test.mjs

      - name: "Test: menus (mailbox commands, JSON escaping, one panel at a time)"
        id: menu
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 20
        run: node tools/menu_test.mjs

      - name: "Test: the menu still answers after every game"
        id: menu_games
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 15
        run: node tools/menu_games_test.mjs

      - name: "Test: touching things (each living thing answers a tap) (allowed to fail: KI-25)"
        id: touch
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 20
        continue-on-error: true
        run: NODE_PATH=$(npm root -g):$PWD/node_modules node tools/touch_test.mjs

      - name: "Test: travel between places (the test home and back) (allowed to fail: KI-25)"
        id: travel
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 15
        continue-on-error: true
        run: NODE_PATH=$(npm root -g):$PWD/node_modules node tools/travel_test.mjs

      # Meridian (the user's driving game) opens from a racing rig and back.
      - name: "Test: Meridian inside the bar"
        id: meridian
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/meridian_test.mjs

      # Two players through the Cloudflare room (run locally with wrangler
      # dev): movement, away, glasses, mirror, jukebox, seats decided by the room.
      - name: "Test: multiplayer (two players + the room)"
        id: mp
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 40
        run: NODE_PATH=$(npm root -g):$PWD/node_modules node tools/mp_test.mjs

      - name: "Test: voice chat (two players, a fake microphone, the room) (allowed to fail: KI-25)"
        id: voice
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 20
        continue-on-error: true
        run: NODE_PATH=$(npm root -g):$PWD/node_modules node tools/voice_test.mjs

      # 4K Mania: the song select opens, a song is charted and played (autoplay).
      - name: "Test: 4K Mania"
        id: mania
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y -q ffmpeg >/dev/null
          node tools/rhythm_test.mjs

      # The lounge's chessboard: tap e2, e4 on the 3D board; the computer answers.
      - name: "Test: chess"
        id: chess
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/chess_test.mjs

      # The avatar customizer: make your own look, it stays after a reload.
      - name: "Test: avatar customizer"
        id: avatar
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 15
        run: node tools/avatar_test.mjs

      # The arcade: tap the platformer machine, the user's game opens and draws.
      - name: "Test: the arcade's platformer"
        id: arcade
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 10
        run: node tools/arcade_test.mjs

      # Two players race each other on the two rigs (the room starts the race).
      - name: "Test: two-player race"
        id: race
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        timeout-minutes: 15
        run: NODE_PATH=$(npm root -g):$PWD/node_modules node tools/race_mp_test.mjs

      # Dev's Overview: how this deploy ended, even when a test failed or the
      # run was stopped: which tests failed, which were allowed to (J2.3).
      - name: "Report: finished (for Dev)"
        if: always() && env.IONOS_SFTP_HOST != ''
        timeout-minutes: 5
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
          LIVE: ${{ needs.build-and-publish.outputs.live }}
        run: node tools/ci_status.mjs game end
