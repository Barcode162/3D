# Builds the C++ app to WebAssembly and publishes the result to the
# `gh-pages` branch on every push to main. GitHub Pages serves that branch
# (repo Settings -> Pages -> Deploy from a branch -> gh-pages / root).
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write        # to cancel a stuck Pages deployment (see below)
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.12
  # IONOS web hosting login (repo Settings -> Secrets and variables ->
  # Actions). When set, the game and the multiplayer relay are also
  # uploaded to the IONOS site. joshuavelasco.com points at the webspace
  # folder IONOS_HOME; every project deploys into its own subfolder of it
  # (this one: IONOS_DIR), and homepage/index.php lists them all.
  IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
  IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
  IONOS_HOME: home
  IONOS_DIR: home/bar

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-v1

      - name: Install Emscripten
        run: |
          if [ ! -d emsdk ]; then git clone --depth 1 https://github.com/emscripten-core/emsdk.git; fi
          ./emsdk/emsdk install $EMSDK_VERSION
          ./emsdk/emsdk activate $EMSDK_VERSION

      - name: Build
        run: |
          source ./emsdk/emsdk_env.sh
          sudo apt-get install -y ninja-build >/dev/null
          emcmake cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" build/site/index.html
          echo "${GITHUB_SHA::7}" > build/site/version.txt
          touch build/site/.nojekyll

      # --- Tests: a failing step stops the job, so nothing broken is
      # published. (restructure step 0.4)
      - name: "Test: native (g++ and em++ + node)"
        run: |
          source ./emsdk/emsdk_env.sh
          bash tools/native/run.sh

      - name: "Test: PHP syntax and EM_ASM lint"
        run: |
          for f in server/*.php; do php -l "$f"; done
          node tools/lint_emasm.mjs

      - name: "Test: room protocol codec (cloud/proto.js on the golden vectors)"
        run: node tools/proto_test.mjs

      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      # Software WebGPU (SwiftShader) works on GitHub's runners (first green
      # run 2026-10-17), so a failing smoke blocks the deploy.
      - name: "Test: browser smoke (Release build)"
        run: FAIL_MODEL=candle node tools/smoke.mjs  # + a blocked download must still let you in

      - name: "Test: menus (mailbox commands, JSON escaping, one panel at a time)"
        run: node tools/menu_test.mjs

      # Prints only whether the Cloudflare secrets exist, whether wrangler
      # accepts the token, and whether a workers.dev subdomain is registered.
      - name: "Check: Cloudflare"
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets: missing"; exit 0
          fi
          echo "Cloudflare secrets: set"
          npm ci --prefix cloud --no-audit --no-fund >/dev/null
          # (whoami's own output has the account email; the logs are public)
          if npx --prefix cloud wrangler whoami 2>&1 | grep -q "You are logged in"; then echo "wrangler: token works"; else echo "wrangler: token rejected"; fi
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          echo "$sub" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("workers.dev subdomain:", (r.get("subdomain") + ".workers.dev") if r.get("subdomain") else "none (" + str([e.get("message") for e in d.get("errors", [])]) + ")")'

      # A Pages deployment that hangs on GitHub's side blocks every later
      # one ("in progress deployment, please cancel <sha> first"). Cancel
      # any unfinished ones so this build can go live.
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo=${{ github.repository }}
          live=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          for sha in $(gh api "repos/$repo/deployments?environment=github-pages&per_page=5" --jq '.[].sha'); do
            [ "$sha" = "$live" ] && continue  # the site that's up now
            echo "Cancelling Pages deployment $sha (no-op if it already finished)"
            gh api -X POST "repos/$repo/pages/deployments/$sha/cancel" || true
          done

      - name: Publish to gh-pages
        run: |
          cd build/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      # The multiplayer relay (server/relay.php) runs on the IONOS web
      # hosting, next to a second copy of the game. mirror sends files whose
      # size or time differ (no --ignore-time: it skipped same-size edits),
      # then every page script and per-build file is sent again by name,
      # with the list taken from build/site so new scripts aren't missed.
      - name: Upload to IONOS
        if: env.IONOS_SFTP_HOST != ''
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          cp server/relay.php server/account.php server/report.php server/.htaccess build/site/
          cd build/site
          lftp --env-password -u "$IONOS_SFTP_USER" "sftp://$IONOS_SFTP_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mkdir -p -f $IONOS_DIR
          mkdir -p -f private/bar/reports
          put -O $IONOS_HOME $GITHUB_WORKSPACE/homepage/index.php
          put -O $IONOS_HOME $GITHUB_WORKSPACE/homepage/.htaccess
          mirror -R --verbose --no-perms --parallel=4 -x '^\.git/' . $IONOS_DIR
          cd $IONOS_DIR
          mput index.html version.txt app.wasm $(ls *.js *.json | tr '\n' ' ') relay.php account.php report.php .htaccess
          cls -l
          bye
          EOF
