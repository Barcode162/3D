<!doctype html>
<html lang="en" data-look="faceplate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="robots" content="noindex, nofollow">
<title>UI Editor · Toolbelt</title>
<!-- The UI Editor (docs/UI_PLAN.md R1.4-R1.7), a Toolbelt tool: edits the
     theme and screen files in ui/system/. The editor's own chrome has a fixed
     plain look (editor.css) so it stays readable whatever the theme being
     edited; only the preview wears the theme. editor.js. -->
<link rel="stylesheet" href="/ui/themes.css">
<link rel="stylesheet" href="/ui/looped.css">
<link rel="stylesheet" href="/ui/screen.css">
<link rel="stylesheet" href="editor.css">
</head>
<body class="ed">
<header class="ed-top">
  <a class="ed-btn ed-icon" href="/dev/#projects" aria-label="Back to Dev"><svg><use href="/ui/icons.svg#i-back"/></svg></a>
  <div class="ed-seg" role="tablist" aria-label="What you edit">
    <button type="button" data-mode="screen" aria-pressed="true">Screen</button>
    <button type="button" data-mode="theme" aria-pressed="false">Theme</button>
  </div>
  <select class="ed-pick" id="pick" aria-label="Which screen"></select>
  <span class="ed-grow"></span>
  <span class="ed-status" id="status"></span>
  <button class="ed-btn ed-icon" id="undo" type="button" aria-label="Undo" disabled><svg><use href="/ui/icons.svg#i-undo"/></svg></button>
  <button class="ed-btn ed-icon" id="redo" type="button" aria-label="Redo" disabled><svg><use href="/ui/icons.svg#i-redo"/></svg></button>
  <button class="ed-btn ed-go" id="pubOpen" type="button">Publish</button>
</header>

<section class="ed-stage" id="stage" aria-label="Preview">
  <div class="ed-stagebar">
    <div class="ed-seg ed-small" aria-label="Preview size">
      <button type="button" data-device="phone" aria-pressed="true">Phone</button>
      <button type="button" data-device="computer" aria-pressed="false">Computer</button>
      <button type="button" data-device="game" aria-pressed="false">In game</button>
    </div>
    <div class="ed-seg ed-small" id="schemeSeg" aria-label="Light or dark">
      <button type="button" data-scheme="dark" aria-pressed="true">Dark</button>
      <button type="button" data-scheme="light" aria-pressed="false">Light</button>
    </div>
    <select class="ed-pick ed-small" id="themePick" aria-label="Preview theme"></select>
  </div>
  <div class="ed-viewport" id="viewport"><div class="lp ed-frame" id="frame"></div></div>
</section>

<section class="ed-sheet" id="sheet">
  <div class="ed-pane" id="treePane">
    <div class="ed-h"><b id="treeTitle">Parts</b><span class="ed-grow"></span><span class="ed-dim" id="count"></span></div>
    <ol class="ed-tree" id="tree"></ol>
  </div>
  <div class="ed-pane" id="inspPane">
    <div class="ed-h"><b id="inspTitle">Nothing selected</b><span class="ed-grow"></span></div>
    <p class="ed-dim ed-what" id="inspWhat">Tap a part in the preview or the list.</p>
    <div class="ed-insp" id="insp"></div>
  </div>
</section>
<div class="ed-scrim" id="pubScrim" hidden></div>
<section class="ed-dialog" id="pub" role="dialog" aria-modal="true" aria-labelledby="pubTitle" hidden>
  <div class="ed-h"><b id="pubTitle">Publish</b><span class="ed-grow"></span><button class="ed-btn ed-icon" id="pubClose" type="button" aria-label="Close"><svg><use href="/ui/icons.svg#i-x"/></svg></button></div>
  <div class="ed-dbody">
    <form id="login" hidden>
      <p class="ed-dim">Log in with your bar account (owner or admin).</p>
      <input class="ed-in" id="user" autocomplete="username" placeholder="Username" aria-label="Username" autocapitalize="none">
      <input class="ed-in" id="pass" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button class="ed-btn ed-go" type="submit">Log in</button>
      <p class="ed-dim" id="loginMsg"></p>
    </form>
    <div id="pubForm">
      <p class="ed-dim" id="pubWhat"></p>
      <ul class="ed-list" id="pubChanges"></ul>
      <input class="ed-in" id="pubNote" maxlength="200" placeholder="What changed, in a few words" aria-label="Note">
      <div class="ed-actions"><button class="ed-btn ed-go" id="pubGo" type="button">Publish</button><button class="ed-btn" id="discard" type="button">Discard my draft</button></div>
      <p class="ed-dim" id="pubMsg"></p>
    </div>
    <b class="ed-group">History</b>
    <ol class="ed-list" id="history"><li class="ed-dim">Log in to see it.</li></ol>
  </div>
</section>
<div class="ed-toast" id="toast" role="status"></div>
<script src="/ui/looped.js"></script>
<script src="/ui/screen.js"></script>
<script src="editor.js"></script>
</body>
</html>
