<title>Bar3D Theme Playground</title>
<style>
/* Layout: the bar fills the screen (a phone frame on a wide screen); the
   Tune panel is a bottom sheet on a phone and a side panel on a wide screen.
   Every theme value is a CSS variable on #app, set live from the panel. */
@font-face { font-family: "Archivo"; src: url("fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Martian Mono"; src: url("fonts/MartianMono.woff2") format("woff2"); font-weight: 100 800; }
@font-face { font-family: "Limelight"; src: url("fonts/Limelight.woff2") format("woff2"); }
@font-face { font-family: "Unbounded"; src: url("fonts/Unbounded.woff2") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "Righteous"; src: url("fonts/Righteous.woff2") format("woff2"); }

:root {
  color-scheme: dark;
  /* the page and the Tune panel (a plain tool look, apart from the theme) */
  --page: #0b0908;
  --tool: #161412;
  --tool-2: #201d1a;
  --tool-line: rgba(255,255,255,.09);
  --tool-ink: #ece6df;
  --tool-ink-2: #a39a90;
  --tool-hi: #f0a24a;
  /* the theme's defaults (the panel overrides them on #app) */
  --accent: #f0a24a;
  --glass-a: .13;
  --blur: 18px;
  --r: 22px;
  --tilt: 9;
  --scale: 1;
  --dur: 1;
  --ease: cubic-bezier(.3, 1.5, .55, 1);
  --bar-light: 1;
  --paper: #ece2cc;
  --print: #2a1d14;
  --stamp: #c33d2e;
  --neon-a: #ff4fa8;
  --neon-b: #35c8ff;
  --poster-bg: #8a1218;
  --poster-ink: #ffd23f;
  --f-text: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-small: "Martian Mono", ui-monospace, Menlo, monospace;
  --f-paper: "Limelight", Georgia, serif;
  --f-neon: "Righteous", "Archivo", sans-serif;
  --f-poster: "Unbounded", "Archivo", sans-serif;
}
html, body { height: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--page); color: var(--tool-ink); font: 14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--tool-hi); outline-offset: 2px; }

#shell { height: 100%; display: grid; }
@media (min-width: 820px) {
  #shell { grid-template-columns: 1fr 380px; }
  #stageWrap { display: grid; place-items: center; padding: 24px; overflow: auto; }
  #app { width: 390px; height: min(800px, calc(100vh - 48px)); border-radius: 40px; box-shadow: 0 0 0 7px #050404, 0 0 0 8px #2e2824, 0 40px 80px rgba(0,0,0,.6); }
  #tune { position: static; transform: none !important; height: 100%; border-radius: 0; border-left: 1px solid var(--tool-line); }
  #tuneBtn, #tuneClose { display: none !important; }
}
#stageWrap { min-height: 0; min-width: 0; }

/* ================= the app (the bar and the theme) ================= */
#app { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; font-family: var(--f-text); color: #fff; font-size: calc(13px * var(--scale)); user-select: none; -webkit-user-select: none; }
.tilt-t { transform: perspective(900px) rotateY(calc(var(--tilt) * -1deg)) rotateX(calc(var(--tilt) * .55deg)) rotate(calc(var(--tilt) * -.17deg)); }

/* the bar behind everything */
.scene { position: absolute; inset: 0; z-index: -1; filter: brightness(var(--bar-light));
  background: radial-gradient(ellipse 95% 55% at 50% 22%, #4a2c18, #1a0f09 70%, #0b0705); }
.lights { position: absolute; inset: 0;
  background:
    radial-gradient(circle at 16% 13%, rgba(255,180,90,.9) 0 2.5px, rgba(255,160,70,.18) 3.5px 20px, transparent 21px),
    radial-gradient(circle at 50% 9%, rgba(255,190,110,.85) 0 2.5px, rgba(255,160,70,.14) 3.5px 18px, transparent 19px),
    radial-gradient(circle at 85% 15%, rgba(255,170,80,.9) 0 2.5px, rgba(255,150,60,.16) 3.5px 22px, transparent 23px); }
.alive .lights { animation: flickerL calc(7s * var(--dur)) ease-in-out infinite; }
@keyframes flickerL { 50% { opacity: .82; } }
.shelf { position: absolute; left: 0; right: 0; top: 27%; height: 9%;
  background: repeating-linear-gradient(90deg, rgba(120,190,150,.38) 0 10px, transparent 10px 16px, rgba(220,150,70,.42) 16px 25px, transparent 25px 34px, rgba(200,90,80,.32) 34px 42px, transparent 42px 52px);
  -webkit-mask: linear-gradient(180deg, transparent 0 25%, #000 25%); mask: linear-gradient(180deg, transparent 0 25%, #000 25%); filter: blur(.6px); }
.counter { position: absolute; left: -10%; right: -10%; bottom: 0; height: 34%;
  background: linear-gradient(180deg, #6a4128 0 2px, #3a2214 2px, #1c110a 40%, #0c0705); border-radius: 50% 50% 0 0 / 14% 14% 0 0; }
.person { position: absolute; width: 46px; height: 110px; transition: transform calc(.5s * var(--dur)) var(--ease); }
.person .hd { position: absolute; left: 12px; top: 0; width: 22px; height: 22px; border-radius: 50%; background: #2e1e14; }
.person .bd { position: absolute; left: 0; top: 25px; width: 46px; height: 85px; border-radius: 20px 20px 6px 6px; background: #2e1e14; }
.person.far { opacity: .55; transform: scale(.7); }
#me { left: calc(50% - 23px); bottom: 31%; }
#me .hd, #me .bd { background: #3d2819; }
#me .arm { position: absolute; left: 40px; top: 28px; width: 11px; height: 44px; border-radius: 6px; background: #3d2819; transform-origin: 50% 90%; transform: rotate(160deg); opacity: 0; }
#me.waving .arm { opacity: 1; animation: waveArm calc(.45s * var(--dur)) ease-in-out 4 alternate; }
@keyframes waveArm { from { transform: rotate(150deg); } to { transform: rotate(195deg); } }
#me.sitting { transform: translateY(26px) scale(.94); }
.bubble { position: absolute; left: 34px; top: -34px; min-width: 34px; padding: 4px 8px; border-radius: 14px; background: #fff; color: #1a0f09; font-size: 18px; text-align: center; opacity: 0; transform: translateY(8px) scale(.6); transition: all calc(.35s * var(--dur)) var(--ease); }
.bubble.show { opacity: 1; transform: none; }
.floor-note { position: absolute; left: 18%; bottom: 25%; width: 38px; height: 28px; background: var(--paper); border-radius: 2px; transform: rotate(-14deg) skewX(-12deg); box-shadow: 0 4px 8px rgba(0,0,0,.5); }
.floor-note::after { content: ""; position: absolute; inset: 7px 6px; background: repeating-linear-gradient(180deg, rgba(42,29,20,.45) 0 1px, transparent 1px 5px); }
.alive .floor-note { animation: nudge calc(3s * var(--dur)) ease-in-out infinite; }
@keyframes nudge { 0%, 88%, 100% { transform: rotate(-14deg) skewX(-12deg); } 92% { transform: rotate(-10deg) skewX(-12deg) translateY(-3px); } }
.pickup { position: absolute; left: calc(18% - 8px); bottom: calc(25% + 34px); font: 600 9px/1 var(--f-small); letter-spacing: .08em; color: rgba(255,255,255,.75); pointer-events: none; }

/* top bar: the song chip and the Tune button */
.topbar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 8px; z-index: 6; }
.chip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 22px; background: rgba(10,7,5,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: calc(11px * var(--scale)); min-width: 0; max-width: 70%; }
.chip > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .art { flex: none; width: 24px; height: 24px; border-radius: 50%; background: conic-gradient(var(--accent), var(--stamp), #6a3fb8, var(--accent)); }
.alive .chip .art { animation: spin calc(6s * var(--dur)) linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.chip i { font-style: normal; opacity: .6; }
#tuneBtn { padding: 7px 14px; border-radius: 22px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25); font: 700 11px/1 -apple-system, sans-serif; letter-spacing: .04em; color: #fff; }

.shade { position: absolute; inset: 0; background: radial-gradient(circle at 85% 88%, rgba(0,0,0,.72), rgba(0,0,0,.2) 70%); opacity: 0; pointer-events: none; transition: opacity calc(.3s * var(--dur)); z-index: 2; }
.shade.on { opacity: 1; pointer-events: auto; }

/* the menu button and the wheel */
.hub { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 62px; border-radius: 50%; z-index: 8;
  background: rgba(255,248,238,.95); color: #1a0f09; font: 800 calc(10px * var(--scale))/1 var(--f-text); letter-spacing: .06em;
  box-shadow: 0 0 0 7px rgba(255,255,255,.12), 0 10px 26px rgba(0,0,0,.5); transition: transform calc(.25s * var(--dur)) var(--ease); }
.hub:active { transform: scale(.92); }
.wheel { position: absolute; right: calc(49px + env(safe-area-inset-right, 0px)); bottom: calc(55px + env(safe-area-inset-bottom, 0px)); width: 0; height: 0; z-index: 7; }
.opt { position: absolute; left: -27px; top: -27px; width: 54px; height: 54px; border-radius: 50%; display: grid; place-content: center; text-align: center; color: #fff;
  font-size: calc(10px * var(--scale)); font-weight: 700; line-height: 1.1;
  background: rgba(24,16,11,.82); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transform: translate(0, 0) scale(.3); opacity: 0; pointer-events: none;
  transition: transform calc(.42s * var(--dur)) var(--ease), opacity calc(.2s * var(--dur)), background .15s; }
.opt small { display: block; font-weight: 500; font-size: calc(7.5px * var(--scale)); opacity: .7; margin-top: 2px; }
.wheel.open .opt { transform: translate(calc(-1 * var(--dx)), calc(-1 * var(--dy))); opacity: 1; pointer-events: auto; transition-delay: calc(var(--i) * 50ms * var(--dur)); }
.opt:active, .opt.hot { background: var(--accent); color: #1a0f09; border-color: transparent; box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 60%, transparent); }
.wheel-label { position: absolute; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(230px + env(safe-area-inset-bottom, 0px)); z-index: 7; font-weight: 800; font-size: calc(24px * var(--scale)); line-height: 1.05; text-shadow: 0 2px 10px rgba(0,0,0,.6); opacity: 0; transform: translateY(8px); transition: all calc(.3s * var(--dur)); pointer-events: none; }
.wheel-label small { display: block; font: 400 calc(9px * var(--scale))/1.2 var(--f-small); letter-spacing: .1em; color: var(--accent); margin-bottom: 4px; }
.wheel-label.on { opacity: 1; transform: none; }
/* press and hold the menu button: a ring fills, then the categories open;
   slide a finger over them and let go to pick (J106.4) */
.hub::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; pointer-events: none;
  background: conic-gradient(var(--accent) calc(var(--hold, 0) * 1turn), transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); opacity: 0; transition: opacity .15s; }
.hub.holding::before { opacity: 1; }
.hub.holding { transform: scale(.94); }
.hub { touch-action: none; }
.opt.cat { width: 60px; height: 60px; left: -30px; top: -30px; background: rgba(32,22,14,.88); font-size: calc(10.5px * var(--scale)); }
.opt.cat .ic, .opt.sub .ic { display: block; font-size: 15px; line-height: 1; margin-bottom: 2px; }
.opt.sub { width: 50px; height: 50px; left: -25px; top: -25px; font-size: calc(9px * var(--scale)); background: rgba(18,12,8,.9); }
.opt.cat.open-cat { background: color-mix(in srgb, var(--accent) 22%, rgba(32,22,14,.9)); border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
.wheel .opt.hot { background: var(--accent); color: #1a0f09; border-color: transparent; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 26px color-mix(in srgb, var(--accent) 70%, transparent); }
.wheel.open .opt.hot { transform: translate(calc(-1 * var(--dx)), calc(-1 * var(--dy))) scale(1.18); transition-delay: 0s; }
.wheel.dragging .opt { transition-delay: 0s; }
.wheel .ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(255,240,220,.16); pointer-events: none; opacity: 0; transition: opacity calc(.3s * var(--dur)); }
.wheel.open .ring { opacity: 1; }
.wheel-label .hint { display: block; margin-top: 6px; font: 500 calc(9px * var(--scale))/1.3 var(--f-small); letter-spacing: .06em; color: rgba(255,255,255,.7); text-shadow: none; }

/* the selection marker: what a tap would use now (in place of the bar's
   green square). A soft ring breathes on the thing, corner brackets close
   in, a glass label says what it is and what a tap does. */
.sel { position: absolute; z-index: 3; pointer-events: none; width: 0; height: 0; transition: opacity calc(.25s * var(--dur)); }
.shade.on ~ .sel, #app.menu-up .sel { opacity: 0; }
.sel .halo { position: absolute; left: -38px; top: -23px; width: 76px; height: 46px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 34%, transparent), transparent); }
.sel .ring { position: absolute; left: -35px; top: -20px; width: 70px; height: 40px; border-radius: 50%; transform: rotateX(58deg);
  border: 1.5px solid color-mix(in srgb, var(--accent) 80%, #fff); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent); }
.alive .sel .ring { animation: selBreathe calc(2.2s * var(--dur)) ease-in-out infinite; }
@keyframes selBreathe { 50% { transform: rotateX(58deg) scale(1.12); opacity: .55; } }
.sel .br { position: absolute; width: 12px; height: 12px; border: 2px solid #fff; opacity: .9; transition: all calc(.4s * var(--dur)) var(--ease); }
.sel .br.a { left: -40px; top: -30px; border-right: 0; border-bottom: 0; border-radius: 4px 0 0 0; }
.sel .br.b { left: 28px; top: -30px; border-left: 0; border-bottom: 0; border-radius: 0 4px 0 0; }
.sel .br.c { left: -40px; top: 18px; border-right: 0; border-top: 0; border-radius: 0 0 0 4px; }
.sel .br.d { left: 28px; top: 18px; border-left: 0; border-top: 0; border-radius: 0 0 4px 0; }
.sel.locked .br.a { left: -28px; top: -22px; } .sel.locked .br.b { left: 16px; top: -22px; }
.sel.locked .br.c { left: -28px; top: 10px; } .sel.locked .br.d { left: 16px; top: 10px; }
.sel .tag { position: absolute; left: 0; bottom: 38px; transform: translateX(-50%); white-space: nowrap; display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 6px; border-radius: 16px; background: rgba(14,9,6,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: inset 0 0 0 1px rgba(255,240,220,.18); font-size: calc(10.5px * var(--scale)); font-weight: 700; }
.sel .tag kbd { font: 700 calc(8px * var(--scale))/1 var(--f-small); letter-spacing: .08em; padding: 4px 6px; border-radius: 10px; background: var(--accent); color: #1a0f09; }
.sel .tag i { font-style: normal; font-weight: 500; opacity: .7; }

/* every part is a layer that springs in */
.layer { position: absolute; z-index: 5; opacity: 0; pointer-events: none; transition: opacity calc(.25s * var(--dur)), transform calc(.45s * var(--dur)) var(--ease); }
.layer.open { opacity: 1; pointer-events: auto; }
.glass { background: rgba(255,236,214,var(--glass-a)); backdrop-filter: blur(var(--blur)) saturate(170%); -webkit-backdrop-filter: blur(var(--blur)) saturate(170%);
  box-shadow: inset 0 1px 0 rgba(255,240,220,.32), inset 0 0 0 1px rgba(255,240,220,.1), 0 14px 34px rgba(0,0,0,.4); }
.sheet-pos { left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform-origin: 50% 100%; }
.layer.sheet-pos:not(.open) { transform: translateY(40px) scale(.96); }
.layer.sheet-pos.open.tilt-t, .layer.tilt-t.open { /* keeps the tilt when open */ }

/* clean glass: the jukebox */
.jb { border-radius: var(--r); padding: 14px; display: grid; gap: 10px; max-height: 64%; }
.jb .t { font-weight: 800; font-stretch: 112%; font-size: calc(19px * var(--scale)); display: flex; justify-content: space-between; align-items: center; }
.seg { display: flex; background: rgba(0,0,0,.28); border-radius: calc(var(--r) * .55); padding: 3px; }
.seg button { flex: 1; text-align: center; padding: 6px 0; border-radius: calc(var(--r) * .42); font-weight: 600; font-size: calc(11px * var(--scale)); color: rgba(255,240,220,.65); transition: background .2s, color .2s; }
.seg button.on { background: rgba(255,240,220,.18); color: #fff; }
.list { display: grid; overflow: auto; max-height: 190px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid rgba(255,240,220,.1); font-size: calc(12.5px * var(--scale)); text-align: left; width: 100%; }
.row i { font-style: normal; display: block; font-size: calc(10px * var(--scale)); color: rgba(255,240,220,.6); }
.row .tm { color: rgba(255,240,220,.65); font-variant-numeric: tabular-nums; flex: none; }
.row .plus { flex: none; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,240,220,.14); display: grid; place-items: center; font-weight: 700; }
.row.playing span:first-child { color: var(--accent); font-weight: 700; }
.prog { height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
.prog b { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }
.btns { display: flex; gap: 8px; }
.go, .plain { flex: 1; text-align: center; font-size: calc(12px * var(--scale)); font-weight: 700; padding: 10px 0; border-radius: calc(var(--r) * .64); }
.go { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); color: #1e1206; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 50%, transparent); }
.plain { background: rgba(255,240,220,.12); }
.go:active, .plain:active { transform: translateY(1px); }
.eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.eq b { width: 3px; border-radius: 2px; background: var(--accent); height: 100%; transform: scaleY(.4); transform-origin: bottom; }
.alive .eq b { animation: eq calc(1s * var(--dur)) ease-in-out infinite; }
.eq b:nth-child(2) { animation-delay: .15s !important; } .eq b:nth-child(3) { animation-delay: .3s !important; } .eq b:nth-child(4) { animation-delay: .45s !important; }
@keyframes eq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

/* the glass strip: emotes */
.strip { left: calc(12px + env(safe-area-inset-left, 0px)); right: calc(84px + env(safe-area-inset-right, 0px)); bottom: calc(31px + env(safe-area-inset-bottom, 0px)); border-radius: 30px; padding: 7px; display: flex; justify-content: space-between; gap: 4px; transform-origin: 100% 50%; }
.strip:not(.open) { transform: translateX(30px) scaleX(.6); }
.strip button { width: 38px; height: 38px; border-radius: 50%; font-size: 19px; display: grid; place-items: center; background: rgba(255,255,255,.1); transition: transform calc(.2s * var(--dur)) var(--ease); }
.strip button:active { transform: scale(1.25); background: #fff; }
.strip-tag { position: absolute; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); font: 500 calc(9px * var(--scale))/1 var(--f-small); letter-spacing: .1em; opacity: 0; transition: opacity .2s; z-index: 5; pointer-events: none; }
.strip.open + .strip-tag { opacity: .8; }

/* the phone */
.phone-l { left: 0; right: 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); height: 440px; display: flex; justify-content: center; }
.phone-l:not(.open) { transform: translateY(120px) rotate(8deg); }
.device { width: 222px; height: 430px; border-radius: 30px; background: #0b0b0d; padding: 7px; position: relative;
  transform: perspective(700px) rotateX(calc(var(--tilt) * 1.1deg)) rotateY(calc(var(--tilt) * -2deg)) rotate(calc(var(--tilt) * -.6deg));
  box-shadow: -14px 24px 40px rgba(0,0,0,.6), inset 0 0 0 1.5px #3a3a40, 4px 0 0 #1c1c20; }
.screen { width: 100%; height: 100%; border-radius: 23px; overflow: hidden; position: relative; background: linear-gradient(170deg, #3a2010, #140b06 65%); padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 9px; }
.screen::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,190,120,.2), transparent 38%); pointer-events: none; }
.ph-top { display: flex; justify-content: space-between; font-size: calc(9.5px * var(--scale)); font-weight: 700; opacity: .85; }
.ph-note { border-radius: 12px; padding: 7px 9px; font-size: calc(10px * var(--scale)); line-height: 1.3; background: rgba(255,255,255,.12); text-align: left; }
.ph-note b { display: block; font-size: calc(8.5px * var(--scale)); opacity: .65; font-weight: 600; }
.ph-note.drop { animation: drop calc(.6s * var(--dur)) var(--ease) both; }
@keyframes drop { from { transform: translateY(-16px); opacity: 0; } }
.np { border-radius: 14px; padding: 9px; display: grid; grid-template-columns: 38px 1fr; gap: 9px; align-items: center; background: rgba(0,0,0,.3); text-align: left; }
.np .art { width: 38px; height: 38px; border-radius: 9px; background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--accent) 70%, #fff), transparent 55%), var(--stamp); }
.np .s { font-weight: 800; font-size: calc(11.5px * var(--scale)); line-height: 1.15; min-width: 0; }
.np .s i { display: block; font-style: normal; font-weight: 400; font-size: calc(9px * var(--scale)); opacity: .6; }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; margin-top: auto; }

      var n = lastPhoneNote || { who: 'Maya', text: 'Saved you a stool by the piano', when: 'just now' };
      h += '<button class="ph-note' + (dropNote ? ' drop' : '') + '" id="phNote"><b>' + esc(n.who).toUpperCase() + ' · ' + esc(n.when) + '</b>' + esc(n.text) + '</button>';
      h += '<button class="np" id="phNp"><span class="art"></span><span class="s">' + esc(s.t) + '<i>Jukebox · <span id="phLeft">' + mmss(s.len - elapsed) + '</span> left</i><span class="eq" style="margin-top:4px"><b></b><b></b><b></b><b></b></span></span></button>';
      h += '<div class="apps">' +
        app_('jukebox', 'Jukebox', 'linear-gradient(135deg,#f8bf68,#ec7f34)') +
        app_('friends', 'Friends', 'linear-gradient(135deg,#7bd08f,#2f8a55)', 2) +
        app_('arcade', 'Arcade', 'linear-gradient(135deg,#ff6fb8,#b0246c)') +
        app_('notes', 'Notes', 'linear-gradient(135deg,#ece2cc,#b9a582)', unread) +
        app_('news', 'Tonight', 'linear-gradient(135deg,#ff5a5a,#8a1218)') +
        app_('tune', 'Tune', 'linear-gradient(135deg,#8c8c96,#45454c)') + '</div>';
    } else if (phoneView === 'friends') {
      h += '<button class="ph-back" data-go="home">‹ Back</button><div class="ph-h">Friends</div><div class="ph-list">';
      friends.forEach(function (f) { h += '<button data-wave="' + esc(f[0]) + '"><span>' + esc(f[0]) + '<i>' + esc(f[1]) + '</i></span><span class="dot' + (f[2] ? '' : ' away') + '"></span></button>'; });
      h += '</div><div style="margin-top:auto;font-size:9px;opacity:.6">Tap a friend to wave.</div>';
    } else if (phoneView === 'notes') {
      h += '<button class="ph-back" data-go="home">‹ Back</button><div class="ph-h">Notes</div><div class="ph-list">';
      notes.forEach(function (n, i) { h += '<button data-note="' + i + '"><span>' + esc(n.title) + '<i>' + esc(n.from) + ' · ' + esc(n.time) + '</i></span><span>›</span></button>'; });
      h += '</div>';
    }
    P.innerHTML = h;
  }
  function app_(id, name, bg, n) { return '<button data-app="' + id + '"' + (n ? ' class="badge"' : '') + '><b style="background:' + bg + '"' + (n ? ' data-n="' + n + '"' : '') + '></b>' + name + '</button>'; }
  $('phone').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'phNp') return open('jukebox');
    if (b.id === 'phNote') { noteIdx = 0; return open('note'); }
    if (b.dataset.go) { phoneView = b.dataset.go; return renderPhone(); }
    if (b.dataset.wave) return toast('You waved at ' + b.dataset.wave);
    if (b.dataset.note != null) { noteIdx = +b.dataset.note; return open('note'); }
    var a = b.dataset.app; if (!a) return;
    if (a === 'friends' || a === 'notes') { phoneView = a; if (a === 'notes') unread = 0; return renderPhone(); }
    if (a === 'tune') { closeLayer(); return openTune(); }
    open(a);
  });

  /* the card */
  function renderNote() {
    var n = notes[noteIdx], P = $('paper'), h = '';
    [].forEach.call($('noteTabs').children, function (b) { b.classList.toggle('on', b.dataset.tab === noteTab); });
    if (n.fresh) h += '<span class="stamp">NEW</span>';
    if (noteTab === 'note') {
      h += '<div class="t">' + esc(n.title) + '</div><div class="from">Left on the counter · ' + esc(n.from) + ' · ' + esc(n.time) + '</div><div class="msg">' + esc(n.msg) + '</div>';
      if (replying) h += '<textarea id="replyBox" placeholder="Write a reply…"></textarea><div class="pkeys"><button class="go-p" data-act="pin">Pin reply</button><button data-act="cancel">Cancel</button></div>';
      else h += '<div class="pkeys" style="margin-top:auto"><button class="go-p" data-act="reply">Reply</button><button data-act="down">Put down</button></div>';
    } else if (noteTab === 'replies') {
      h += '<div class="t">Replies</div>';
      if (!n.replies.length) h += '<div class="msg">No replies yet. Be the first.</div>';
      n.replies.forEach(function (r) { h += '<div class="preply"><b>' + esc(r[0]) + ':</b> ' + esc(r[1]) + '</div>'; });
      h += '<div class="pkeys" style="margin-top:auto"><button class="go-p" data-act="reply">Reply</button><button data-act="down">Put down</button></div>';
    } else {
      h += '<div class="t">The board</div>';
      notes.forEach(function (o, i) { h += '<button class="pboard" data-open="' + i + '"><span>' + esc(o.title) + '</span><i>' + esc(o.from) + '</i></button>'; });
    }
    P.innerHTML = h;
    var box = $('replyBox'); if (box) box.focus();
  }
  $('noteTabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; noteTab = b.dataset.tab; replying = false; renderNote(); });
  $('paper').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var n = notes[noteIdx], act = b.dataset.act;
    if (b.dataset.open != null) { noteIdx = +b.dataset.open; noteTab = 'note'; replying = false; return renderNote(); }
    if (act === 'reply') { noteTab = 'note'; replying = true; return renderNote(); }
    if (act === 'cancel') { replying = false; return renderNote(); }
    if (act === 'pin') { var v = ($('replyBox').value || '').trim(); if (!v) { toast('Write something first'); return; } n.replies.push(['You', v]); n.fresh = false; replying = false; noteTab = 'replies'; toast('Reply pinned to the note'); return renderNote(); }
    if (act === 'down') { n.fresh = false; closeLayer(); toast('You put the note down'); }
  });

  /* arcade */
  function renderArcade() {
    var h = '';
    games.forEach(function (g, i) { h += '<button class="g' + (g.wide ? ' wide' : '') + (i === gameSel ? ' on' : '') + '" data-g="' + i + '">' + g.n + '<i>' + g.s() + '</i></button>'; });
    $('games').innerHTML = h; $('play').textContent = 'Play ' + games[gameSel].n.toLowerCase();
  }
  $('games').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; gameSel = +b.dataset.g; renderArcade(); });
  $('play').addEventListener('click', function () { toast(games[gameSel].n + ' would start here'); });

  /* poster */
  function renderPoster() {
    var ev = events[evIdx], ppl = ev.people.slice(), h = '';
    if (joined[evIdx]) ppl.unshift('you');
    h += '<div class="meta"><span>' + ev.meta[0] + '</span><span>' + ev.meta[1] + '</span></div><div class="big">' + esc(ev.big) + '</div><div class="when">' + esc(ev.when) + '</div>';
    ev.rows.forEach(function (r) { h += '<div class="prow"><span>' + esc(r[0]) + '</span><span>' + esc(r[1] || (ppl.slice(0, 3).join(', ') + (ppl.length > 3 ? ', +' + (ppl.length - 3) : ''))) + '</span></div>'; });
    h += '<div class="pk"><button data-act="join">' + (joined[evIdx] ? 'You\'re in ✓' : 'I\'m in →') + '</button><button class="ghost" data-act="next">Next</button></div>';
    h += '<div class="pager">' + events.map(function (_, i) { return '<b' + (i === evIdx ? ' class="on"' : '') + '></b>'; }).join('') + '</div>';
    $('posterBody').innerHTML = h;
  }
  $('L-news').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'join') { joined[evIdx] = !joined[evIdx]; toast(joined[evIdx] ? 'You\'re signed up for ' + events[evIdx].big : 'You left ' + events[evIdx].big); }
    if (b.dataset.act === 'next') evIdx = (evIdx + 1) % events.length;
    renderPoster();
  });

  /* the live details */
  var incoming = [['Leo', 'Darts in 5? I\'m warming up'], ['Sam', 'The racing rig is free'], ['Ana', 'On my way, order me a lemonade'], ['Maya', 'Request a song for me!']], inc = 0, tick = 0;
  setInterval(function () {
    if (!S.alive) return;
    tick++;
    elapsed++;
    if (elapsed >= songs[0].len) nextSong(); else updateProg();
    if (current === 'jukebox' && jbTab === 'queue') { var t = $('jbList').querySelector('.tm'); if (t) t.textContent = mmss(songs[0].len - elapsed); }
    if (current === 'phone') { var c = $('phClock'); if (c) c.textContent = clock(); var l = $('phLeft'); if (l) l.textContent = mmss(songs[0].len - elapsed); }
    if (tick % 6 === 0) { here = Math.max(9, Math.min(22, here + (Math.random() < .5 ? -1 : 1))); var ph = $('phHere'); if (ph) ph.textContent = here; }
    if (tick % 9 === 0) { dartsPlaying = dartsPlaying === 2 ? 3 : 2; if (current === 'arcade') renderArcade(); }
    if (tick % 25 === 0) {
      var m = incoming[inc++ % incoming.length];
      lastPhoneNote = { who: m[0], text: m[1], when: 'just now' }; unread++;
      if (current === 'phone' && phoneView === 'home') renderPhone(true);
      else if (!current) toast(m[0] + ': ' + m[1]);
    }
  }, 1000);

  apply();
  buildTune();
  renderJukebox();
})();
</script>
