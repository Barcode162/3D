<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hub</title>
<style>
  /* The project hub (hub.php is its server). Phone first, dense and sharp. */
  :root {
    --bg:#0d0e11; --panel:#15171c; --panel2:#1c1f26; --raise:#232731; --line:#2a2f3a; --line2:#363c4a;
    --text:#e7e9ee; --dim:#9098a8; --faint:#646c7c; --accent:#5b8cff; --accent2:#3d6fe6; --warn:#f0b03c; --bad:#ff6b6b;
    --idea:#8a90a6; --review:#e0a23a; --ready:#36b37e; --doing:#4c8dff; --check:#d65aa8; --done:#5c6370;
    --r:5px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
         padding-bottom: env(safe-area-inset-bottom); -webkit-text-size-adjust: 100%; }
  a { color: var(--accent); text-decoration: none; }
  h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
  h1 { font-size: 18px; } h2 { font-size: 16px; } h3 { font-size: 13px; }
  .cap { font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .dim { color: var(--dim); } .faint { color: var(--faint); } .small { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; } .grow { flex: 1; min-width: 0; } .wrap { flex-wrap: wrap; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r);
           padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  button:active { background: var(--raise); }
  button.primary { background: var(--accent2); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  button.sm { padding: 5px 9px; font-size: 12px; }
  button.icon { padding: 6px 9px; min-width: 34px; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; }
  input, textarea, select { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
                            border: 1px solid var(--line2); border-radius: var(--r); padding: 9px 10px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
  label { display: block; margin: 14px 0 5px; }
  .err { color: var(--bad); min-height: 1.2em; font-size: 13px; margin: 6px 0; }
  .ok { color: var(--ready); }

  /* top bar */
  .top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent);
         backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
         padding: calc(env(safe-area-inset-top) + 8px) 12px 0; }
  .top .bar { display: flex; align-items: center; gap: 6px; min-height: 36px; }
  .crumb { font-weight: 650; font-size: 16px; }
  .crumb .sep { color: var(--faint); margin: 0 4px; font-weight: 400; }
  .search { margin: 8px 0 0; position: relative; }
  .search input { padding-left: 30px; font-size: 15px; background: var(--panel); }
  .search::before { content: "⌕"; position: absolute; left: 10px; top: 7px; color: var(--faint); font-size: 16px; }
  .nav { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { padding: 5px 10px; font-size: 13px; background: transparent; border-color: var(--line); color: var(--dim); }
  .nav button.on { background: var(--raise); border-color: var(--line2); color: var(--text); }
  .nav .div { width: 1px; background: var(--line2); margin: 3px 4px; flex: none; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 3px; font-size: 11px;
           line-height: 17px; text-align: center; background: var(--line2); color: var(--text); font-weight: 600; }
  .badge.hot { background: var(--warn); color: #1a1405; }

  main { padding: 12px 12px 40px; max-width: 980px; margin: 0 auto; }

  /* projects */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; cursor: pointer; }
  .tile .shot { aspect-ratio: 16/9; background: var(--panel2) center/cover no-repeat; border-bottom: 1px solid var(--line);
                display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 28px; font-weight: 700; }
  .tile .body { padding: 12px 12px 10px; }
  .tile .about { color: var(--dim); font-size: 13px; margin: 4px 0 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tile.add { display: flex; align-items: center; justify-content: center; min-height: 140px; color: var(--dim); border-style: dashed; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .stats b { color: var(--text); font-weight: 600; }

  /* stage marks */
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 3px;
         border: 1px solid var(--line2); color: var(--dim); white-space: nowrap; }
  .c-idea { --s: var(--idea); } .c-review { --s: var(--review); } .c-ready { --s: var(--ready); }
  .c-doing { --s: var(--doing); } .c-check { --s: var(--check); } .c-done { --s: var(--done); }
  .dot.c-idea, .dot.c-review, .dot.c-ready, .dot.c-doing, .dot.c-check, .dot.c-done { background: var(--s); }
  .tag.c-idea, .tag.c-review, .tag.c-ready, .tag.c-doing, .tag.c-check, .tag.c-done { color: var(--s); border-color: color-mix(in srgb, var(--s) 45%, transparent); }
  .tag.q { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

  /* lists */
  .group { margin: 0 0 16px; }
  .ghead { display: flex; align-items: center; gap: 8px; padding: 6px 2px; }
  .ghead .cap { color: var(--dim); }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer;
          border-left: 3px solid var(--s, transparent); min-height: 48px; }
  .item:first-child { border-top: 0; }
  .item:active { background: var(--panel2); }
  .item .t { font-weight: 550; }
  .item .m { font-size: 12px; color: var(--faint); margin-top: 1px; }
  .item .chev { color: var(--faint); }
  .empty { padding: 14px 12px; color: var(--faint); font-size: 13px; }
  .shead { margin: 2px 0 12px; }
  .shead .about { color: var(--dim); font-size: 13px; margin-top: 3px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 10px; cursor: pointer; }
  .stat .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .stat .l { font-size: 11px; color: var(--dim); }
  details.done > summary { list-style: none; cursor: pointer; }
  details.done > summary::-webkit-details-marker { display: none; }

  /* card screen */
  .screen { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
  .screen .top { position: static; }
  .seg { display: flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; margin: 8px 0; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 7px 4px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--raise); color: var(--text); font-weight: 600; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 24px; }
  .scroll > * { max-width: 760px; margin-left: auto; margin-right: auto; }
  .pipe { display: flex; gap: 3px; margin: 4px 0 6px; }
  .pipe div { flex: 1; height: 4px; border-radius: 2px; background: var(--line2); }
  .pipe div.on { background: var(--s); }
  .pipe-l { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 12px; margin: 0 0 12px; }
  .block .cap { margin-bottom: 6px; display: block; }
  .pre { white-space: pre-wrap; word-wrap: break-word; -webkit-user-select: text; user-select: text; }
  .callout { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); }
  .stagepick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stagepick button { font-size: 12px; padding: 7px 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .stagepick button.on { border-color: var(--s); background: color-mix(in srgb, var(--s) 15%, var(--panel2)); color: var(--text); }
  .fields div { margin: 0 0 8px; } .fields b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
  .ref { color: var(--accent); cursor: pointer; }
  .msgs { display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); }
  .msg.me { align-self: flex-end; background: color-mix(in srgb, var(--accent) 16%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .msg.question { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
  .msg .who { font-size: 11px; color: var(--faint); margin-bottom: 3px; }
  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .composer > div { max-width: 760px; margin: 0 auto; }
  .composer textarea { min-height: 44px; max-height: 40vh; font-size: 16px; }
  .composer .ask { font-size: 12px; color: var(--warn); margin-bottom: 6px; }
  .hist { font-size: 12px; color: var(--faint); padding: 3px 0; }
  .saved { font-size: 12px; color: var(--ready); }

  /* sheets (forms, drawer) */
  .sheet { position: fixed; inset: 0; z-index: 40; background: #000b; display: none; align-items: flex-end; justify-content: center; }
  .sheet.open { display: flex; }
  .sheetBody { width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--line2);
               border-radius: 9px 9px 0 0; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); }
  .drawer .item { border-left-width: 0; }
  .big { font-size: 20px; letter-spacing: 2px; -webkit-user-select: text; user-select: text; word-break: break-all; margin: 8px 0; }
  .center { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 110px); transform: translateX(-50%); z-index: 60;
           background: var(--raise); border: 1px solid var(--line2); padding: 8px 14px; border-radius: var(--r); font-size: 13px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  @media (min-width: 900px) {
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 18px; max-width: 1180px; margin: 0 auto; }
    .side { display: block !important; position: sticky; top: 120px; align-self: start; padding-top: 12px; }
    .side .item { min-height: 34px; padding: 6px 10px; border-left: 0; }
  }
  .side { display: none; }

  /* ---- finding things: home, the section map, the bottom tabs ---- */
  .hello { margin: 2px 0 12px; }
  .hello h2 { font-size: 19px; }
  .hello .dim { font-size: 13px; margin-top: 2px; }
  .summary4 { grid-template-columns: repeat(4, 1fr); }
  .summary4 .n { font-size: 20px; }
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .maptile { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 10px 10px 9px; cursor: pointer;
             display: flex; flex-direction: column; gap: 4px; min-height: 88px; position: relative; overflow: hidden;
             transition: border-color .2s, transform .15s; }
  .maptile:active { transform: scale(.98); border-color: var(--line2); }
  .maptile .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
  .maptile .ab { font-size: 11.5px; color: var(--faint); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
  .maptile .ct { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .sbar { display: flex; gap: 2px; height: 4px; border-radius: 2px; overflow: hidden; background: var(--line); }
  .sbar i { display: block; background: var(--s); transform-origin: left; }
  .anim .sbar i { animation: grow .7s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 35ms + .15s); }
  .newdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 0 var(--accent);
            animation: ping 2s ease-out infinite; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; border-top: 1px solid var(--line);
          background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
          padding: 4px 4px env(safe-area-inset-bottom); }
  .tabs button { flex: 1; background: transparent; border: 0; border-radius: var(--r); color: var(--faint); padding: 6px 2px 5px;
                 display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; position: relative; }
  .tabs button svg { width: 21px; height: 21px; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  .tabs button.on { color: var(--text); }
  .tabs button.on svg { color: var(--accent); transform: translateY(-1px) scale(1.08); }
  .tabs .badge { position: absolute; top: 1px; left: calc(50% + 6px); margin: 0; }
  .has-tabs main { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px) { .tabs { display: none; } .has-tabs main { padding-bottom: 40px; } .top .nav { display: none; } }
  .grip { flex: none; width: 26px; align-self: stretch; margin: -10px 0 -10px -6px; display: flex; align-items: center; justify-content: center;
          color: var(--faint); touch-action: none; cursor: grab; }
  .grip svg { width: 12px; height: 16px; }
  .list.sorting .item { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
  .list.sorting .item.lifted { transition: none; position: relative; z-index: 2; background: var(--raise);
                               box-shadow: 0 10px 28px #000a; border-radius: 4px; }
  .skel { height: 48px; border-radius: 7px; margin: 0 0 8px; background: linear-gradient(90deg, var(--panel) 0%, var(--panel2) 50%, var(--panel) 100%);
          background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .skel.short { width: 45%; height: 20px; }

  /* ---- motion: how things appear ---- */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(-4px); }
                      to { opacity: 1; clip-path: inset(0 0 0 0); transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes slideIn { from { opacity: .4; transform: translateX(34px); } to { opacity: 1; transform: none; } }
  @keyframes slideOut { to { opacity: 0; transform: translateX(34px); } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); }
                    70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  @keyframes breathe { 50% { opacity: .45; } }
  @keyframes glow { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); } }
  .anim .item, .anim .tile, .anim .stat, .anim .maptile, .anim .block, .anim .ghead, .anim .shead, .anim .empty, .anim .hello .dim {
    animation: rise .48s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 35ms); }
  .anim h1, .anim .hello h2, .anim .shead h2 { animation: reveal .6s cubic-bezier(.2,.8,.2,1) backwards; }
  .anim .msg { animation: pop .4s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 40ms); }
  .anim .pipe div.on { transform-origin: left; animation: grow .5s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 70ms + .1s); }
  .screen.enter { animation: slideIn .34s cubic-bezier(.2,.8,.2,1); }
  .screen.leave { animation: slideOut .22s ease-in forwards; pointer-events: none; }
  .scroll.fade > * { animation: fade .3s cubic-bezier(.2,.8,.2,1) backwards; }
  .seg { position: relative; }
  .seg::before { content: ""; position: absolute; top: 0; bottom: 0; width: 25%; left: calc(var(--k, 0) * 25%); background: var(--raise);
                 transition: left .3s cubic-bezier(.2,.8,.2,1); }
  .seg button { position: relative; transition: color .2s; }
  .seg button.on { background: transparent; }
  .tag.q { animation: glow 2.6s ease-in-out infinite; }
  .dot.c-doing { animation: breathe 1.8s ease-in-out infinite; }
  button { transition: transform .12s, background-color .15s, border-color .15s, opacity .15s; }
  button:active:not(:disabled) { transform: scale(.97); }
  .item { transition: background-color .15s; }
  .tile { transition: border-color .2s, transform .15s; }
  .tile:active { transform: scale(.985); }
  .tile .shot { transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  .tile:hover .shot, .tile:active .shot { transform: scale(1.04); }
  .sheet { display: flex; visibility: hidden; background: #0000; transition: background-color .25s, visibility 0s .32s; }
  .sheet.open { visibility: visible; background: #000b; transition: background-color .25s; }
  .sheetBody { transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.8,.2,1); }
  .sheet.open .sheetBody { transform: none; }
  .toast { transform: translate(-50%, -8px) scale(.96); transition: opacity .22s, transform .3s cubic-bezier(.2,.8,.2,1); }
  .toast.on { transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important;
                             transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="screen"></div>
<div class="sheet" id="sheet"><div class="sheetBody" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
// The hub: projects → a project's board → a card (hub.php is the server).
// Routes live in the address (#/p/<project>/<view>, #/p/<project>/c/<card>) so
// the phone's back swipe works. Logins are the bar's accounts.
var API = 'hub.php', ACCOUNTS = '../bar/account.php';
var STAGES = ['idea', 'review', 'ready', 'doing', 'check', 'done'];
var STAGE_NAMES = { idea: 'Idea', review: 'Waiting for your review', ready: 'Ready for Claude', doing: 'In progress',
                    check: 'Check on phone', done: 'Done' };
var STAGE_SHORT = { idea: 'Idea', review: 'Review', ready: 'Ready', doing: 'In progress', check: 'Check', done: 'Done' };
// Within a section, the cards that need something come first.
var GROUP_ORDER = ['check', 'review', 'ready', 'doing', 'idea', 'done'];
var LABELS = ['YOUR NOTES', 'WHAT', 'NOW', 'STEPS', 'LATER', 'NEEDS', 'UNLOCKS', 'NOT HERE', 'DETAILS', 'HOME'];
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { if (v == null || v === '') localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
};
var state = { token: store.get('hubToken') || '', projects: null, you: '', role: '', board: null, project: '', query: '',
              cardTab: {} };

// ---- small helpers ----
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  for (var k in attrs || {}) {
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e[k] = v;
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  (kids || []).forEach(function (c) { if (c != null && c !== false) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function post(url, body) {
  return fetch(url, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain' }, cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (!r || !r.ok) { var e = new Error((r && r.error) || 'Something went wrong.'); e.code = r; throw e; } return r; });
}
function api(body) { body.token = state.token; if (state.project && !body.project) body.project = state.project; return post(API, body); }
function toast(text) {
  var t = document.getElementById('toast');
  t.textContent = text; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 1800);

    api({ a: 'save', card: { id: c.id, notes: notes.value } }).then(function () {
      store.set(key, ''); status.textContent = 'Saved · Claude will read it'; save.disabled = true;
      reloadBoard(renderBoardQuiet);
    }).catch(function (e) { status.textContent = e.message; });
  };
  box.appendChild(el('div', { class: 'block' }, [el('span', { class: 'cap', text: 'What you want' }), notes,
    el('div', { class: 'row', style: 'margin-top:8px' }, [save, status])]));
  var pp = planParts(c.plan);
  var shown = pp.parts.filter(function (p) { return ['WHAT', 'STEPS', 'LATER', 'NOT HERE', 'DETAILS', 'HOME', 'YOUR NOTES'].indexOf(p.label) >= 0 && p.text; });
  var names = { 'YOUR NOTES': 'Your earlier notes', WHAT: 'What the player gets', STEPS: 'Steps', LATER: 'Later', 'NOT HERE': 'Not on this card',
                DETAILS: 'Full plan in', HOME: 'Where it would go' };
  if (shown.length || pp.loose) {
    var blk = el('div', { class: 'block fields' }, [el('span', { class: 'cap', text: 'Claude\'s plan' })]);
    shown.forEach(function (p) { blk.appendChild(el('div', {}, [el('b', { text: names[p.label] }), p.label === 'NOT HERE' ? refsLine(p.text) : el('div', { class: 'pre', text: p.text })])); });
    if (pp.loose) blk.appendChild(el('div', { class: 'pre dim', text: pp.loose }));
    box.appendChild(blk);
  } else box.appendChild(el('div', { class: 'block faint', text: 'No plan from Claude yet. Write what you want above; on "go" Claude turns it into a plan.' }));
  linksBlock(box, c);
}
function talkTab(box, c, draw) {
  var msgs = el('div', { class: 'msgs' });
  var thread = c.thread || [];
  // Cards from before the conversation: show the old report/question as messages.
  if (!thread.length && c.report) thread = [{ role: 'claude', who: 'Claude', kind: 'report', text: c.report, at: c.updated }];
  if (c.question && !thread.some(function (m) { return m.kind === 'question' && m.text === c.question; })) {
    thread = thread.concat([{ role: 'claude', who: 'Claude', kind: 'question', text: c.question, at: c.updated }]);
  }
  thread.forEach(function (m) {
    var kind = { question: 'asks', answer: 'answered', report: 'reported', note: '' }[m.kind] || '';
    msgs.appendChild(el('div', { class: 'msg' + (m.role === 'owner' ? ' me' : '') + (m.kind === 'question' ? ' question' : '') }, [
      el('div', { class: 'who', text: (m.role === 'owner' ? 'You' : m.who) + (kind ? ' ' + kind : '') + ' · ' + ago(m.at) }),
      el('div', { class: 'pre', text: m.text })]));
  });
  if (!thread.length) msgs.appendChild(el('div', { class: 'faint', style: 'text-align:center;padding:30px 0',
    text: 'No messages yet. Write to Claude below; it reads them when you say "go".' }));
  box.appendChild(msgs);
  if (c.unread) box.appendChild(el('div', { class: 'faint small', style: 'text-align:right;margin-top:6px', text: 'Claude reads this on the next "go".' }));
  // The answer box, always at the bottom.
  var key = 'hubDraft:' + c.id;
  var input = el('textarea', { placeholder: c.question ? 'Your answer, in plain words…' : 'Message Claude about this card…', rows: 2 });
  input.value = store.get(key) || '';
  var grow = function () { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight + 2, window.innerHeight * 0.4) + 'px'; };
  var send = el('button', { class: 'primary', text: c.question ? 'Answer' : 'Send' });
  var sendReady = c.stage !== 'ready' && c.stage !== 'doing' && c.stage !== 'done'
    ? el('button', { text: 'Send + Ready', title: 'Send, and put the card in Claude\'s queue' }) : null;
  var doSend = function (ready) {
    var text = input.value.trim();
    if (!text) return;
    send.disabled = true;
    api({ a: 'say', id: c.id, text: text }).then(function () {
      return ready ? api({ a: 'save', card: { id: c.id, stage: 'ready' } }) : null;
    }).then(function () {
      store.set(key, ''); toast(ready ? 'Sent · in Claude\'s queue' : 'Sent');
      reloadBoard(function () { draw(); renderBoardQuiet(); });
    }).catch(function (e) { send.disabled = false; toast(e.message); });
  };
  input.oninput = function () { store.set(key, input.value); grow(); };
  send.onclick = function () { doSend(false); };
  if (sendReady) sendReady.onclick = function () { doSend(true); };
  setTimeout(grow, 0);
  return el('div', { class: 'composer' }, [el('div', {}, [
    c.question ? el('div', { class: 'ask ellipsis', text: 'Answering: ' + c.question }) : null,
    input, el('div', { class: 'row', style: 'margin-top:6px' }, [el('div', { class: 'grow faint small', text: c.question ? '' : 'Claude reads this on "go".' }), sendReady, send])])]);
}
function detailsTab(box, c) {
  var title = el('input', { value: c.title });
  var section = el('select', {}, state.board.sections.map(function (s) {
    return el('option', { value: s.id, text: s.name + (s.advanced ? ' (advanced)' : '') });
  }));
  section.value = c.section;
  var plan = el('textarea', { style: 'min-height:220px;font:13px/1.45 ui-monospace,Menlo,monospace' });
  plan.value = c.plan || '';
  var msg = el('div', { class: 'err' });
  box.appendChild(el('div', { class: 'block' }, [el('label', { class: 'cap', style: 'margin-top:0', text: 'Title' }), title,
    el('label', { class: 'cap', text: 'Section' }), section,
    el('label', { class: 'cap', text: 'Claude\'s plan (the full text)' }), plan, msg,
    el('div', { class: 'row', style: 'margin-top:8px' }, [el('button', { class: 'primary', text: 'Save', onclick: function () {
      api({ a: 'save', card: { id: c.id, title: title.value, section: section.value, plan: plan.value } }).then(function () {
        toast('Saved'); reloadBoard(function () { openCard(c.id); renderBoardQuiet(); });
      }).catch(function (e) { msg.textContent = e.message; });
    } })])]));
  box.appendChild(el('div', { class: 'block' }, [el('span', { class: 'cap', text: 'Order and remove' }),
    el('div', { class: 'row wrap' }, [
      el('button', { class: 'sm', text: '▲ Up in section', onclick: function () { api({ a: 'move', id: c.id, dir: -1 }).then(function () { toast('Moved up'); reloadBoard(renderBoardQuiet); }); } }),
      el('button', { class: 'sm', text: '▼ Down', onclick: function () { api({ a: 'move', id: c.id, dir: 1 }).then(function () { toast('Moved down'); reloadBoard(renderBoardQuiet); }); } }),
      el('div', { class: 'grow' }),
      el('button', { class: 'sm danger', text: 'Delete', onclick: function () {
        if (confirm('Delete "' + c.title + '"?')) api({ a: 'delete', id: c.id }).then(function () { reloadBoard(backToBoard); });
      } })])]));
  if (c.history && c.history.length) {
    box.appendChild(el('div', { class: 'block' }, [el('span', { class: 'cap', text: 'History' })].concat(
      c.history.slice().reverse().slice(0, 20).map(function (h) {
        return el('div', { class: 'hist', text: new Date(h.at * 1000).toLocaleString() + ' · ' + h.who + ': ' + h.what });
      }))));
  }
  box.appendChild(el('div', { class: 'faint small', style: 'text-align:center', text: 'Card ' + c.id }));
}

// ---- account: password, recovery code, the Claude key ----
function accountSheet() {
  var old = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'Current password' });
  var nw = el('input', { type: 'password', autocomplete: 'new-password', placeholder: 'New password (6+ characters)' });
  var msg = el('div', { class: 'err' });
  var big = el('div', { class: 'big' });
  var needOld = function () { if (!old.value) { msg.textContent = 'Type your current password first.'; return false; } return true; };
  openSheet([el('h2', { text: 'Account' }), el('div', { class: 'dim small', text: 'Logged in as ' + (state.you || '…') }),
    el('label', { class: 'cap', text: 'Current password' }), old, el('label', { class: 'cap', text: 'New password' }), nw,
    el('div', { class: 'row', style: 'margin-top:10px' }, [
      el('button', { class: 'primary', text: 'Change password', onclick: function () {
        if (!needOld()) return;
        post(ACCOUNTS, { a: 'password', token: state.token, old: old.value, new: nw.value })
          .then(function () { msg.textContent = 'Password changed.'; old.value = nw.value = ''; })
          .catch(function (e) { msg.textContent = e.message; });
      } })]),
    el('label', { class: 'cap', text: 'Recovery code' }),
    el('button', { class: 'sm', text: 'Make a recovery code', onclick: function () {
      if (!needOld()) return;
      post(ACCOUNTS, { a: 'recovery', token: state.token, pass: old.value }).then(function (r) {
        big.textContent = r.code; msg.textContent = 'Save this code (screenshot or note). Shown only once; a new one replaces it.';
      }).catch(function (e) { msg.textContent = e.message; });
    } }),
    el('label', { class: 'cap', text: 'Claude key (lets Claude read and update every board)' }),
    el('button', { class: 'sm', text: 'Make a new Claude key', onclick: function () {
      if (!confirm('Make a new Claude key? The old one stops working.')) return;
      post(API, { a: 'key', token: state.token }).then(function (r) {
        big.textContent = r.key; msg.textContent = 'Copy this key into Claude\'s environment settings as HUB_KEY. Shown only once.';
      }).catch(function (e) { msg.textContent = e.message; });
    } }),
    big, msg,
    el('div', { class: 'row', style: 'margin-top:14px' }, [
      el('button', { text: 'Log out', onclick: function () { store.set('hubToken', ''); state.token = ''; closeSheet(); loginScreen(); } }),
      el('div', { class: 'grow' }), el('button', { text: 'Close', onclick: closeSheet })])]);
}

// Keep the project list's names for the board's title.
route();
if (state.token && parseHash().page !== 'projects') post(API, { a: 'projects', token: state.token }).then(function (r) {
  state.projects = r.projects; state.you = r.you;
  var c = document.querySelector('.top .crumb'); if (c && !document.querySelector('.screen')) c.textContent = projectName();
}).catch(function () {});
// Live: the board refreshes every 30 seconds while you look at it (not while you type or a card is open).
setInterval(function () {
  if (!state.token || document.hidden || !state.board || parseHash().page !== 'board') return;
  if (document.getElementById('sheet').classList.contains('open') || document.querySelector('.screen')) return;
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  api({ a: 'board' }).then(function (b) { state.board = b; route(); }).catch(function () {});
}, 30000);
</script>
