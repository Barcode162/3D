# Bar3D realtime server on Cloudflare (see cloud/worker.js and
# docs/DECISIONS.md -> Hosting split). Deployed by .github/workflows/deploy.yml.
name = "bar3d"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Accounts still live on the IONOS side for now; the room asks it who a
# login token belongs to.
ACCOUNT_URL = "https://joshuavelasco.com/bar/account.php"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
