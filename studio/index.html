<!doctype html>
<html lang="en" data-look="faceplate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Studio</title>
<!-- The Studio (docs/STUDIO.md): the bar's own engine in studio mode
     (/bar/?studio=1, bar/studio_mode.cpp) in a full-screen frame, with the
     Studio's controls around it (studio.js). Owner and admins only. -->
<link rel="stylesheet" href="/ui/themes.css">
<link rel="stylesheet" href="/ui/looped.css">
<link rel="stylesheet" href="studio.css">
</head>
<body class="lp">
<div id="app" hidden>
  <iframe id="world" title="The world" allow="autoplay"></iframe>
  <header id="top" class="panel over">
    <a class="key small" href="/dev/#projects" aria-label="Back to Dev"><svg class="ico"><use href="/ui/icons.svg#i-back"/></svg></a>
    <button id="placeKey" class="key small" type="button" aria-label="Place"><span id="placeName">Bar</span><svg class="ico"><use href="/ui/icons.svg#i-down"/></svg></button>
    <span id="saved" class="saved"><span class="steps" data-period="2" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="savedText">Loading the world…</span></span>
    <button id="undoPub" class="key small" type="button" hidden>Undo publish</button>
    <button id="publish" class="key go small" type="button" disabled>Publish</button>
  </header>
  <div id="crumb" class="panel over" hidden><span id="crumbPath" class="path"></span>
    <button id="lockKey" class="key small" type="button" aria-label="Lock the selection"><span class="kled"></span><svg class="ico"><use href="/ui/icons.svg#i-lock"/></svg></button>
    <button id="moreKey" class="key small" type="button" aria-label="Duplicate, row, rename, delete">⋯</button>
    <button id="deselect" class="key small" type="button" aria-label="Deselect"><svg class="ico"><use href="/ui/icons.svg#i-x"/></svg></button></div>
  <div id="tools" class="panel over" hidden>
    <div class="rowk" id="scopeRow"><span class="seg field" id="scopeSeg"><button type="button" class="on" data-every="0">This one</button><button type="button" data-every="1">Every <span id="kindName"></span><span id="kindCount"></span></button></span></div>
    <div class="rowk" id="toolKeys">
      <button class="key small lit" type="button" data-tool="0"><svg class="ico"><use href="/ui/icons.svg#i-move"/></svg>Move</button>
      <button class="key small" type="button" data-tool="1"><svg class="ico"><use href="/ui/icons.svg#i-turn"/></svg>Turn</button>
      <button class="key small" type="button" data-tool="2"><svg class="ico"><use href="/ui/icons.svg#i-size"/></svg>Size</button>
      <button class="key small" type="button" id="dropKey" aria-label="Drop it onto what's below">Drop</button>
      <button class="key small" type="button" id="putOnKey" aria-label="Put it on another thing"><span class="kled"></span>On…</button>
      <button class="key small" type="button" id="extrudeKey" hidden aria-label="A new box out of this face"><svg class="ico"><use href="/ui/icons.svg#i-extrude"/></svg>Extrude</button>
      <button class="key small" type="button" id="partKey" aria-label="Edit one of its parts"><span class="kled"></span><span id="partText">Part</span></button>
    </div>
    <div class="rowk" id="axisKeys">
      <button class="key small lit" type="button" data-axis="0" style="--accent:var(--ax-x);--led:var(--ax-x)"><span class="kled"></span>X</button>
      <button class="key small" type="button" data-axis="1" style="--accent:var(--ax-y);--led:var(--ax-y)"><span class="kled"></span>Y</button>
      <button class="key small" type="button" data-axis="2" style="--accent:var(--ax-z);--led:var(--ax-z)"><span class="kled"></span>Z</button>
      <button class="key small" type="button" data-axis="3" id="allKey" hidden><span class="kled"></span>All</button>
      <span class="seg field" id="faceSeg" hidden><button type="button" class="on" data-face="0" aria-label="Both sides">↔</button><button type="button" data-face="-1" aria-label="The minus side moves">−</button><button type="button" data-face="1" aria-label="The plus side moves">+</button></span>
      <span class="seg field" id="spaceSeg"><button type="button" class="on" data-space="world">World</button><button type="button" data-space="local">Local</button></span>
      <button class="key small lit" type="button" id="snapKey"><span class="kled"></span><span id="snapText">5 cm</span></button>
    </div>
    <div class="valrow">
      <span class="axisname num" id="axisName">X</span>
      <input id="valField" class="field num" inputmode="decimal" enterkeyhint="done" aria-label="Value">
      <span class="unit dim" id="unitText">m</span>
      <button class="key small" type="button" id="flipKey" aria-label="Change the sign">±</button>
    </div>
    <div class="fader field jog" id="jog" role="slider" aria-label="Drag to change; slide up for finer" tabindex="0">
      <div class="ticks"></div><div class="cap" id="jogCap"><span class="bubble" id="jogBubble"></span></div>
    </div>
  </div>
  <div id="hits" class="panel over" hidden></div>
  <div id="partList" class="panel over pop" hidden></div>
  <div id="thingMenu" class="panel over pop" hidden></div>
  <div id="placeMenu" class="panel over pop" hidden></div>
  <div id="views" class="panel over pop" hidden></div>
  <footer id="bottom" class="panel over">
    <button id="monitorKey" class="key small" type="button" aria-label="Open the Monitor"><svg class="ico"><use href="/ui/icons.svg#i-layers"/></svg></button>
    <span class="seg field" id="camModes" role="group" aria-label="Camera">
      <button type="button" data-cam="0" class="on" aria-label="Orbit"><svg class="ico"><use href="/ui/icons.svg#i-orbit"/></svg></button>
      <button type="button" data-cam="1" aria-label="Fly"><svg class="ico"><use href="/ui/icons.svg#i-fly"/></svg></button>
      <button type="button" data-cam="2" aria-label="Top"><svg class="ico"><use href="/ui/icons.svg#i-top"/></svg></button>
      <button type="button" data-cam="3" aria-label="Walk"><svg class="ico"><use href="/ui/icons.svg#i-walk"/></svg></button>
    </span>
    <button id="addKey" class="key small" type="button" aria-label="Add something"><svg class="ico"><use href="/ui/icons.svg#i-plus"/></svg></button>
    <button id="viewsKey" class="key small" type="button" aria-label="Saved views"><svg class="ico"><use href="/ui/icons.svg#i-eye"/></svg></button>
    <button id="undo" class="key small" type="button" aria-label="Undo" disabled><svg class="ico"><use href="/ui/icons.svg#i-undo"/></svg></button>
    <button id="redo" class="key small" type="button" aria-label="Redo" disabled><svg class="ico"><use href="/ui/icons.svg#i-redo"/></svg></button>
  </footer>
  <section id="monitor" class="panel over" hidden aria-label="Monitor"></section>
  <section id="library" class="panel over" hidden aria-label="Add"></section>
  <section id="publishSheet" class="panel over" hidden aria-label="Publish">
    <h2>Publish</h2>
    <p id="pubSummary" class="dim"></p>
    <div id="pubProblems"></div>
    <input id="pubNote" class="field" maxlength="200" placeholder="A few words: what changed (optional)" aria-label="What changed">
    <div class="row"><button id="pubCancel" class="key" type="button">Not yet</button><button id="pubGo" class="key go" type="button">Publish</button></div>
    <div class="row"><button id="shareKey" class="key small" type="button">Try it with a friend first</button></div>
    <div id="shareBox" class="row" hidden><input id="shareLink" class="field" readonly aria-label="The link to your draft"><button id="shareCopy" class="key small" type="button">Copy</button></div>
  </section>
</div>

<div id="login" hidden>
  <form id="loginForm" class="panel">
    <span class="steps big" data-period="2" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <h1>Studio</h1>
    <p class="dim">Build and change the world. For the bar's owner and admins.</p>
    <input id="user" class="field" autocomplete="username" placeholder="Username" aria-label="Username">
    <input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button class="key go" type="submit">Log in</button>
    <p id="loginError" class="dim" role="alert"></p>
  </form>
</div>
<script src="/ui/looped.js"></script>
<script type="module" src="studio.js"></script>
</body>
</html>
