<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0906">
<title>Compare themes · Looped</title>
<!-- One screen in every theme, side by side (docs/archive/UI_PLAN.md R2.4):
     /ui/compare.html?s=<screen>&scheme=light|dark|both. Tap a phone to open it full size.
     A fixed look of its own (Ember's dark half, like the UI Editor), so the phones show each theme as it is. -->
<style>
  @font-face { font-family: "Archivo"; src: url("fonts/Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root { --bg: #0E0906; --bg2: #17100B; --line: #3A2B20; --text: #F6EBDD; --dim: #C2AC92; --acc: #F4A64A;
          --font: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg2); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: 16px; margin: 0 6px 0 0; }
  select, .seg button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; font: 600 13px var(--font); min-height: 34px; padding: 4px 8px; }
  .seg { display: inline-flex; gap: 2px; }
  .seg button[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px 12px; padding: 14px max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px)); }
  figure { margin: 0; display: grid; gap: 6px; align-content: start; }
  .phone { position: relative; width: 100%; aspect-ratio: 390 / 760; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.4); }
  .phone iframe { position: absolute; top: 0; left: 0; width: 390px; height: 760px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .phone a { position: absolute; inset: 0; }
  figcaption b { display: block; font-size: 14px; }
  figcaption span { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Compare themes</h1>
  <select id="screen" aria-label="Screen"></select>
  <div class="seg" id="scheme" aria-label="Light or dark">
    <button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button><button type="button" data-v="both">Both</button>
  </div>
  <label><input type="checkbox" id="old"> Older themes</label>
</header>
<main id="grid"></main>
<script>
(function () {
  'use strict';
  var q = {}; location.search.replace(/[?&]([a-z]+)=([a-z0-9-]+)/g, function (_, k, v) { q[k] = v; });
  var OLD = ['faceplate', 'backbar', 'obsidian', 'jukebox'];
  var house = '';
  var state = { screen: q.s || 'front-door', scheme: q.scheme || 'light', old: q.old === '1' }, themes = [], screens = [];
  function get(p) { return fetch('system/' + p, { cache: 'no-cache' }).then(function (r) { return r.json(); }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fit() {
    [].forEach.call(document.querySelectorAll('.phone'), function (p) { p.firstChild.style.transform = 'scale(' + (p.clientWidth / 390) + ')'; });
  }
  function draw() {
    var grid = document.getElementById('grid'); grid.textContent = '';
    var halves = state.scheme === 'both' ? ['light', 'dark'] : [state.scheme];
    themes.forEach(function (t) {
      if (!state.old && OLD.indexOf(t.id) >= 0) return;
      halves.forEach(function (sc) {
        var has = t.scheme === sc || (t.other && t.other.scheme === sc);
        var src = 'screen.html?s=' + state.screen + '&look=' + t.id + '&scheme=' + sc;
        var f = el('figure'), ph = el('div', 'phone'), fr = el('iframe'), a = el('a');
        fr.src = src; fr.loading = 'lazy'; fr.title = t.name + ' ' + sc; fr.tabIndex = -1;
        a.href = src; a.setAttribute('aria-label', 'Open ' + t.name + ' (' + sc + ') full size');
        ph.appendChild(fr); ph.appendChild(a); f.appendChild(ph);
        var cap = el('figcaption'); cap.appendChild(el('b', null, (t.id === house ? 'House · ' : '') + t.name + (halves.length > 1 || !has ? ' · ' + sc + (has ? '' : ' (no ' + sc + ' half)') : '')));
        cap.appendChild(el('span', null, t.about)); f.appendChild(cap);
        grid.appendChild(f);
      });
    });
    [].forEach.call(document.querySelectorAll('#scheme button'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === state.scheme)); });
    fit();
    try { history.replaceState(null, '', '?s=' + state.screen + '&scheme=' + state.scheme + (state.old ? '&old=1' : '')); } catch (e) {}
  }
  document.getElementById('scheme').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { state.scheme = b.dataset.v; draw(); } });
  document.getElementById('screen').addEventListener('change', function () { state.screen = this.value; draw(); });
  document.getElementById('old').addEventListener('change', function () { state.old = this.checked; draw(); });
  window.addEventListener('resize', fit);
  Promise.all([get('themes/index.json'), get('screens/index.json')]).then(function (a) {
    screens = a[1].order; house = a[0].house || '';
    return Promise.all([Promise.all(a[0].order.map(function (id) { return get('themes/' + id + '.json'); })), Promise.all(screens.map(function (id) { return get('screens/' + id + '.json'); }))]);
  }).then(function (b) {
    themes = b[0];
    var sel = document.getElementById('screen');
    b[1].forEach(function (s) { var o = el('option', null, s.name); o.value = s.id; sel.appendChild(o); });
    sel.value = state.screen; document.getElementById('old').checked = state.old;
    draw();
  });
})();
</script>
</body>
</html>
