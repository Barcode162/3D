<!doctype html>
<html lang="en" data-look="faceplate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<title>Screen · Looped</title>
<!-- Draws one screen file (docs/UI_PLAN.md R1.3): /ui/screen.html?s=<id>
     (ui/system/screens/<id>.json), in the theme in use (?look=<theme>). -->
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="looped.css">
<link rel="stylesheet" href="screen.css">
<style>
  [hidden] { display: none !important; }
  #out { max-width: 1060px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #msg { padding: 24px 16px; color: var(--text-2); }
</style>
</head>
<body class="lp">
<main id="out" class="gutter"></main>
<p id="msg" hidden></p>
<script src="looped.js"></script>
<script src="screen.js"></script>
<script>
(function () {
  var id = (location.search.match(/[?&]s=([a-z0-9-]+)/) || [])[1] || 'sampler';
  var msg = document.getElementById('msg');
  Looped.loadParts().then(function () {
    return fetch('system/screens/' + id + '.json', { cache: 'no-cache' });
  }).then(function (r) { if (!r.ok) throw new Error('No screen called "' + id + '".'); return r.json(); })
    .then(function (s) { document.title = s.name + ' · Looped'; Looped.screen(s, document.getElementById('out')); })
    .catch(function (e) { msg.textContent = e.message || 'The screen did not load.'; msg.hidden = false; });
})();
</script>
</body>
</html>
