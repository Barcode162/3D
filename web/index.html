<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bar3D">
<meta name="theme-color" content="#0b0710">
<title>Bar3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0710; overflow: hidden;
               overscroll-behavior: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; touch-action: none; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0;
         display: flex; justify-content: space-between; align-items: center; gap: 8px;
         padding: 6px 10px; font: 12px/1.3 ui-monospace, Menlo, monospace; color: #f5d9a8;
         pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud button { pointer-events: auto; font: inherit; color: inherit; background: #0008;
                border: 1px solid #f5d9a855; border-radius: 6px; padding: 4px 8px; }
  #log { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
         max-height: 40%; overflow: auto; margin: 0; padding: 8px; border-radius: 8px;
         background: #000c; color: #ddd; font: 11px/1.4 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; word-break: break-word; -webkit-user-select: text; user-select: text;
         touch-action: pan-y; }
  #log.hidden { display: none; }
  #log .err { color: #ff7a7a; }
  /* Virtual joystick, positioned by engine/input.cpp. */
  #stickBase, #stickKnob { position: fixed; left: 0; top: 0; display: none; pointer-events: none;
                           border-radius: 50%; }
  #stickBase { width: 120px; height: 120px; margin: -60px 0 0 -60px;
               border: 2px solid #f5d9a866; background: #f5d9a811; }
  #stickKnob { width: 50px; height: 50px; margin: -25px 0 0 -25px; background: #f5d9a855; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <span id="status">loading…</span>
  <span>build <span id="build">__BUILD__</span> <button id="logToggle">log</button></span>
</div>
<div id="stickBase"></div>
<div id="stickKnob"></div>
<pre id="log" class="hidden"></pre>
<script>
  // On-screen log: everything C++ prints, plus any JavaScript/WebAssembly
  // errors, so problems can be read (and screenshotted) on a phone.
  (function () {
    var logEl = document.getElementById('log');
    var build = document.getElementById('build').textContent;
    document.getElementById('logToggle').onclick = function () { logEl.classList.toggle('hidden'); };

    function append(text, isError) {
      var line = document.createElement('div');
      if (isError) { line.className = 'err'; logEl.classList.remove('hidden'); }
      line.textContent = text;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }
    window.addEventListener('error', function (e) { append('JS error: ' + e.message, true); });
    window.addEventListener('unhandledrejection', function (e) { append('Promise error: ' + e.reason, true); });

    if (!navigator.gpu) append('This browser has no WebGPU. Use Safari on iOS 26+.', true);
    append(navigator.userAgent);

    window.Module = {
      print: function (t) { append(t, false); },
      printErr: function (t) { append(t, true); },
      // Cache-bust per build so Safari never runs a stale .wasm.
      locateFile: function (path) { return path + '?v=' + build; },
      onAbort: function (what) { append('Aborted: ' + what, true); },
    };
    var audio = document.createElement('script');
    audio.src = 'audio.js?v=' + build;
    audio.async = false;
    audio.onerror = function () { append('Failed to load audio.js', true); };
    document.body.appendChild(audio);
    var script = document.createElement('script');
    script.async = false;  // run after audio.js
    script.src = 'app.js?v=' + build;
    script.onerror = function () { append('Failed to load app.js', true); };
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
